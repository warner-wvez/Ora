/* ---------- spatial camera order (arrow cycling) ----------
   Source order in these feeds is NOT a geographic sweep: consecutive cameras in a state file
   can sit 100+ km apart (Ohio's are essentially shuffled), so stepping i±1 would fling the map
   across the state on most presses. Instead each state is ordered once along a Hilbert curve,
   which keeps neighbours in the list neighbours on the ground — median hop ~1-2 km, versus
   10-100 km for source order. Prev/next is then a single step through that order, and the
   position doubles as a progress counter through the state. O(n log n), computed once, cached. */
const camOrderCache={}, GREEDY_MAX=2000;   // above this, O(n^2) greedy would jank the main thread
function hilbertIndex(order,x,y){ let d=0;
  for(let s=1<<(order-1); s>0; s>>=1){
    const rx=(x&s)>0?1:0, ry=(y&s)>0?1:0;
    d += s*s*((3*rx)^ry);
    if(ry===0){ if(rx===1){ x=s-1-x; y=s-1-y; } const t=x; x=y; y=t; }   // rotate the quadrant
  }
  return d;
}
// Hilbert-curve order: O(n log n), used for the big states. Neighbours in the list stay near
// on the ground (median hop 1-2 km in dense states), and there is no build-time jank.
function hilbertChain(pts){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of pts){ if(p[0]<minX)minX=p[0]; if(p[0]>maxX)maxX=p[0]; if(p[1]<minY)minY=p[1]; if(p[1]>maxY)maxY=p[1]; }
  const O=16, N=(1<<O)-1, sx=(maxX-minX)||1, sy=(maxY-minY)||1;
  return pts.map((p,i)=>[hilbertIndex(O, Math.round((p[0]-minX)/sx*N), Math.round((p[1]-minY)/sy*N)), i])
            .sort((a,b)=>a[0]-b[0]).map(o=>o[1]);
}
// Greedy nearest-neighbour walk from the westmost camera: O(n^2), but tighter than Hilbert on
// the sparse states' tail (WV p90 57 km -> 30 km) and free where n is small. Squared lon/lat
// distance is enough to pick the nearest — the cos(lat) correction never changes which is closest.
function greedyChain(pts){
  const n=pts.length, used=new Uint8Array(n);
  let cur=0; for(let i=1;i<n;i++) if(pts[i][0]<pts[cur][0]) cur=i;
  const order=new Array(n); order[0]=cur; used[cur]=1;
  for(let k=1;k<n;k++){ const cx=pts[cur][0], cy=pts[cur][1]; let best=-1, bd=Infinity;
    for(let j=0;j<n;j++){ if(used[j]) continue; const dx=pts[j][0]-cx, dy=pts[j][1]-cy, d=dx*dx+dy*dy; if(d<bd){ bd=d; best=j; } }
    order[k]=best; used[best]=1; cur=best; }
  return order;
}
// A camera cycles within its GROUP's combined order, not its layer's. For most states the
// group is the one state; New York is st-NY plus the folded New York City feed, so every NY
// camera — state highway or city — cycles as one continuous run. Built over all active, loaded
// members and keyed by the group's primary key; invalidated when a member loads or toggles.
const cycleGroupKey=(k)=> foldParent(k)||k;
function spatialOrder(gk){
  if(camOrderCache[gk]) return camOrderCache[gk];
  const entries=[];                                    // {k, i, c} across every active loaded member of the group
  groupKeys(gk).forEach(g=>{ if(store.activeLayers.has(g) && dataCache[g])
    dataCache[g].features.forEach((f,i)=>entries.push({k:g, i, c:f.geometry.coordinates})); });
  if(!entries.length) return null;
  const pts=entries.map(e=>e.c);
  const perm = pts.length<=GREEDY_MAX ? greedyChain(pts) : hilbertChain(pts);   // permutation of entry indexes
  const seq=perm.map(ei=>entries[ei]);                 // seq[p] = {k, i} of the camera at position p
  const pos=new Map();
  seq.forEach((e,p)=>pos.set(e.k+'/'+e.i, p));
  return camOrderCache[gk]={seq, pos, total:seq.length};
}
const orderPos=(ord,k,i)=> ord.pos.get(k+'/'+i);       // 0-based position of a camera, or undefined if not in the order
function invalidateOrder(k){ delete camOrderCache[cycleGroupKey(k)]; }   // a member loaded or toggled: rebuild on next use
// directions arrive as a JSON string from the cluster pipeline but as a live array from the
// feed cache; normalize once so every caller gets a real array
function readProps(feature){ return (typeof feature.properties.directions==='string')
  ? {...feature.properties, directions:JSON.parse(feature.properties.directions)} : feature.properties; }
// the sidebar states A–Z (folded feeds like New York City are part of their parent, not their
// own entry), so "next state" is what the eye expects and NY is a single stop
function orderedLiveKeys(){ return liveKeys().filter(k=>!foldParent(k)).sort((a,b)=>LAYERS[a].name.localeCompare(LAYERS[b].name)); }
// centre the map on a camera being cycled to. Offset keeps the pin clear of the left panel
// (desktop) the same way a route-jump does; on a phone the sheet sits low so centre is fine.
function easeToCam(coords){ map.easeTo({center:coords, zoom:Math.max(map.getZoom(),14), duration:420, offset:isMobile()?[0,0]:[-170,0]}); }

let cycleBoundary=null, cycleNoteT=null, suppressEnlargeClose=false;
function flashCycleNotice(msg){
  const n=document.getElementById('cycleNote'); if(!n) return;
  n.textContent=msg; n.classList.add('show');
  clearTimeout(cycleNoteT); cycleNoteT=setTimeout(()=>n.classList.remove('show'), 2600);
}
// step one camera prev(-1)/next(+1) through the current state's spatial order. In add-to-route
// mode this only navigates — it never auto-adds the cameras you pass (you still tap the keepers).
function cycleCamera(dir){
  const s=store.selected; if(!s || s.k==null) return;
  const cfg=LAYERS[s.k]; if(!cfg || cfg.kind!=='live') return;
  if(s.i==null || s.i<0) return;                       // off-feed selection (a saved-route cam): nothing to step through
  const gk=cycleGroupKey(s.k), ord=spatialOrder(gk); if(!ord) return;
  const cur=orderPos(ord,s.k,s.i); if(cur==null) return;
  const np=cur+dir;
  if(np<0 || np>=ord.total){ cycleToNextState(gk, dir); return; }
  cycleBoundary=null;
  const e=ord.seq[np], feat=dataCache[e.k].features[e.i];
  easeToCam(feat.geometry.coordinates);
  selectFeature(e.k, feat, {i:e.i, noAutoAdd:true});
}
// jump straight to a position in the group's order (1-based, clamped). Double-clicking the pager
// counter opens an input for this, so "go to the last camera" is one gesture, not 100 arrow
// presses — handy for parking at a state's edge before crossing into the next.
function jumpToOrderPos(pos1){
  const s=store.selected; if(!s || s.k==null || s.i==null || s.i<0) return;
  const ord=spatialOrder(cycleGroupKey(s.k)); if(!ord) return;
  const p=Math.max(0, Math.min(ord.total-1, (pos1|0)-1));
  cycleBoundary=null;
  const e=ord.seq[p], feat=dataCache[e.k].features[e.i];
  easeToCam(feat.geometry.coordinates);
  selectFeature(e.k, feat, {i:e.i, noAutoAdd:true});
}
// at either end of a state, the first press names the neighbour and a second press crosses in,
// so you learn which state is next and never fall out of one into another by accident. fromK is
// a group's primary key, so New York (state + city) is a single stop in this sequence.
async function cycleToNextState(fromK, dir){
  const keys=orderedLiveKeys(), at=keys.indexOf(fromK); if(at<0 || keys.length<2) return;
  const nextK=keys[(at+dir+keys.length)%keys.length];
  if(!cycleBoundary || cycleBoundary.k!==fromK || cycleBoundary.dir!==dir){
    cycleBoundary={k:fromK, dir};
    flashCycleNotice(`End of ${LAYERS[fromK].name} — press ${dir>0?'→':'←'} again for ${LAYERS[nextK].name}`);
    return;
  }
  cycleBoundary=null;
  await enableGroup(nextK, false);                     // pull in the whole next group (its folded feeds too)
  const ord=spatialOrder(nextK); if(!ord) return;
  const startPos = dir>0 ? 0 : ord.total-1;            // forward lands on the group's first camera, backward on its last
  const e=ord.seq[startPos], feat=dataCache[e.k].features[e.i];
  easeToCam(feat.geometry.coordinates);
  selectFeature(e.k, feat, {i:e.i, noAutoAdd:true});
  flashCycleNotice(`Now in ${LAYERS[nextK].name}`);
}
// fullscreen cycling advances the camera behind the overlay too, so closing lands on the one
// you stopped on. selectFeature removes the old popup, and popup.remove() fires that popup's
// close handler which would closeEnlarge() — suppress exactly that, we are replacing it, not
// closing it. At a state edge fullscreen stops with a note rather than crossing over.
function flashEnlargeHint(msg){ const h=enlargeState&&enlargeState.ov.querySelector('.enlarge-hint'); if(!h) return;
  const old=h.dataset.base||h.textContent; h.dataset.base=old; h.textContent=msg;
  setTimeout(()=>{ if(h.isConnected) h.textContent=h.dataset.base; }, 2200); }
function cycleEnlarge(dir){
  const s=store.selected; if(!s || s.k==null) return;
  const cfg=LAYERS[s.k]; if(!cfg || cfg.kind!=='live' || s.i==null || s.i<0) return;
  const gk=cycleGroupKey(s.k), ord=spatialOrder(gk); if(!ord) return;
  const cur=orderPos(ord,s.k,s.i); if(cur==null) return;
  const np=cur+dir;
  if(np<0 || np>=ord.total){ flashEnlargeHint(`End of ${LAYERS[gk].name} — exit to change states`); return; }
  const e=ord.seq[np], feat=dataCache[e.k].features[e.i], ncfg=LAYERS[e.k], props=readProps(feat), dir0=props.directions[0];
  easeToCam(feat.geometry.coordinates);
  suppressEnlargeClose=true;                            // the replaced popup's close must not tear the overlay down
  selectFeature(e.k, feat, {i:e.i, noAutoAdd:true});
  suppressEnlargeClose=false;
  const rt=modeCtx.returnTo;                            // keep the ORIGINAL return target so Esc still exits cleanly
  teardownEnlarge(true);
  modeCtx={dir:dir0, cfg:ncfg, props, returnTo:rt};     // the next camera may be a different feed (NY state ↔ city)
  buildEnlarge(modeCtx);
}

/* ---------- selection ---------- */
function selectFeature(k, feature, opts){
  const cfg=LAYERS[k], coords=feature.geometry.coordinates.slice();
  const props=readProps(feature);
  // the feed index locates this camera in the spatial order for prev/next. The map-click path
  // hands it in (opts.i); other callers derive it, and a synthetic off-feed feature yields -1.
  const i = (opts&&opts.i!=null) ? opts.i : (dataCache[k] ? dataCache[k].features.indexOf(feature) : -1);
  // add-to-route: a map tap adds the camera AND opens it, so you see what you just
  // added and can undo right there — no more collecting unlabeled dots from memory.
  // (Search picks navigate without auto-adding; the popup's Add button is one tap.)
  if(store.addingTo && cfg.kind==='live' && !(opts&&opts.noAutoAdd)) addCameraToRoute(k, props, coords);
  // a map click only opens the camera's popup — it never becomes a sticky selection or a
  // shared-link filter. Only the side panel governs what the map shows. store.selected is a
  // transient handle so the popup's "+ Route" button knows which camera it is on.
  // The old popup must close BEFORE store.selected is set: its close handler nulls
  // store.selected, and the wrong order wiped every selection after the first.
  // the old container closes BEFORE the new selection is installed; the token guard
  // makes any stale async wiring a no-op either way
  if(popup){ const p=popup; popup=null; p.remove(); }
  destroyPopupHls();
  store.selected={coords,k,props,token:++selToken,i};
  const token=selToken;
  const html = cfg.kind==='live' ? buildLivePopup(props,cfg) : buildEnfPopup(props);
  if(isMobile()){
    // phones get the bottom sheet: map stays visible and interactive above it
    openSheet(html);
    if(cfg.kind==='live') wireCameraUI(document.getElementById('sheetContent').firstElementChild, props, cfg, token);
  } else {
    popup=new maplibregl.Popup({closeButton:true,maxWidth:cfg.kind==='live'?'288px':'260px'}).setLngLat(coords).setHTML(html).addTo(map);
    const mine=popup;
    if(cfg.kind==='live') setTimeout(()=>{ if(popup===mine && selectionAlive(token)) wireCameraUI(mine.getElement(), props, cfg, token); },0);
    mine.on('close',()=>{ if(selectionAlive(token)) store.selected=null; destroyPopupHls(); if(!suppressEnlargeClose) closeEnlarge(); });
  }
}

function setGroupOpen(g,open){

/* ---------- basemap ---------- */
function applyContrast(){ const w=store.basemap==='satellite';
  ['cams__points','cams__clusters'].forEach(id=>{ if(map.getLayer(id)) map.setPaintProperty(id,'circle-stroke-width', w?3:2.5); });
  if(map.getLayer('chi-enf__circle')) map.setPaintProperty('chi-enf__circle','circle-stroke-width', w?2:1.5); }
function setBasemap(mode){ store.basemap=mode; map.setLayoutProperty('sat-layer','visibility', mode==='satellite'?'visible':'none'); applyContrast(); }

/* ---------- one morphing camera pipeline (all live layers share it) ----------
   All active states feed one supercluster index rendered into one source, and on
   every integer-zoom crossing the transition is animated: on the way in, children
   slide out of the cluster that held them; on the way out, they glide back in and
   the merged bubble takes over. Same deterministic engine and identical counts as
   the built-in clustering, plus 34 sources / ~100 layers collapse into 1 / 3. */
const CAMS_SRC='src-cams';
let camsIndex=null, camsZ=null, camsAnim=null, camsRebuildT=null;
function camsBbox(){ const b=map.getBounds(); const w=b.getWest(),e=b.getEast(),s=b.getSouth(),n=b.getNorth();
  const px=(e-w)*0.5, py=(n-s)*0.5;                    // pad half a viewport so pans don't reveal blanks
  return [w-px, Math.max(-85,s-py), e+px, Math.min(85,n+py)]; }
function camsGet(z){ return camsIndex.getClusters(camsBbox(), Math.max(0,z)); }
function camsSet(features){ const s=map.getSource(CAMS_SRC); if(s) s.setData({type:'FeatureCollection',features}); }
function camsKey(f){ const p=f.properties; return p.cluster ? 'c'+p.cluster_id : 'p'+p.k+'/'+p.i; }
function scheduleCamsRebuild(){ clearTimeout(camsRebuildT); camsRebuildT=setTimeout(buildCamsIndex,120); }
function buildCamsIndex(){
  const pts=[];
  // while routes are up only the chosen route's cameras show (camFocus), the way the big apps
  // clear everything off the map that is not about the trip
  store.activeLayers.forEach(k=>{ if(LAYERS[k].kind!=='live') return; const d=dataCache[k]; if(!d) return;
    d.features.forEach((f,i)=>{ if(camFocus && !camFocus.has(k+'/'+i)) return;
      pts.push({type:'Feature',geometry:f.geometry,properties:{k,i,name:f.properties.name,status:f.properties.status||'snapshot'}}); }); });
  stopCamsAnim(); camsZ=Math.floor(map.getZoom());
  if(!pts.length){ camsIndex=null; camsSet([]); return; }
  if(!window.Supercluster){ camsIndex=null; camsSet(pts); return; }   // CDN failed: raw pins beat nothing
  camsIndex=new Supercluster({radius:32,maxZoom:11,minPoints:3}).load(pts);
  camsSet(camsGet(camsZ));
}
function stopCamsAnim(){ if(camsAnim){ cancelAnimationFrame(camsAnim.raf); camsSet(camsAnim.final); camsZ=camsAnim.toZ; camsAnim=null; } }
// Runs on every frame of a zoom, so it does nothing until the whole zoom level changes. It used
// to re-send every pin each frame (71 times in one level of wheel zoom), and each re-send makes
// MapLibre rebuild the pin layer; that was the stutter. Within a level the pins already cover
// half a viewport past each edge, which is all of the view one level further out, and moveend
// tops them up after a pan.
let camsCrossAt=0;
function camsRender(e){ if(!camsIndex) return; const z=Math.floor(map.getZoom());
  if(z===camsZ) return;
  // The morph re-sends every pin each frame for 260 ms. That reads well after a tap on + or -,
  // but under a finger (a wheel or pinch) or mid-flight (level after level within half a second)

  const now=performance.now(), rapid=now-camsCrossAt<500; camsCrossAt=now;

function startCamsMorph(z1,z2){
  stopCamsAnim();

  // children of a cluster are the items it splits into one level down; that mapping is
  // the whole animation. Items present at both levels (same key) simply stay put.
  const link={};
  for(const f of (zoomIn?from:to)){ if(!f.properties.cluster) continue;
    let ch=[]; try{ ch=camsIndex.getChildren(f.properties.cluster_id); }catch(e){}
    for(const c of ch) link[camsKey(c)]=f.geometry.coordinates; }
  const stay=new Set((zoomIn?from:to).map(camsKey));
  let animated=0;
  const frames=(zoomIn?to:from).map(f=>{
    const own=f.geometry.coordinates, other=stay.has(camsKey(f))?null:link[camsKey(f)];
    if(other) animated++;
    return zoomIn ? {p:f.properties, a:other||own, b:own} : {p:f.properties, a:own, b:other||own};
  });

    const t=Math.min(1,(now-t0)/DUR), e=1-Math.pow(1-t,3);

      geometry:{type:'Point',coordinates:[a[0]+(b[0]-a[0])*e, a[1]+(b[1]-a[1])*e]}})));
    if(t<1) anim.raf=requestAnimationFrame(tick);
    else { camsAnim=null; camsZ=z2; camsSet(to); }
  };

}
function addCamsLayers(){
  map.addSource(CAMS_SRC,{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'cams__clusters',type:'circle',source:CAMS_SRC,filter:['has','point_count'],paint:{'circle-color':'#007aff','circle-radius':['step',['get','point_count'],14,25,18,150,24,1000,30,10000,38],'circle-opacity':0.9,'circle-stroke-width':2.5,'circle-stroke-color':'#fff'}});

// a tapped pin answers instantly with a ring, before any data or popup work happens
function pressFeedback(coords, r){ setHighlight('hover', coords, r); setTimeout(()=>clearHighlight('hover'), 240); }
// what a click on a camera feature means, shared by the layer handler and the
// stale-render fallback below
function camsHitAction(f){
  if(f.properties.cluster){ if(!camsIndex) return;
    let z; try{ z=camsIndex.getClusterExpansionZoom(f.properties.cluster_id); }catch(err){ return; }
    map.easeTo({center:f.geometry.coordinates, zoom:z, duration:500});
  } else { const p=f.properties;
    const orig=dataCache[p.k]&&dataCache[p.k].features[p.i]; if(orig) selectFeature(p.k,orig,{i:p.i}); }

// hit-test the supercluster index directly: everything within a finger radius of the point
function camsAtPoint(point){
  if(!camsIndex) return null;
  const p1=map.unproject([point.x-22, point.y+22]), p2=map.unproject([point.x+22, point.y-22]);
  let cand=[]; try{ cand=camsIndex.getClusters([p1.lng, p1.lat, p2.lng, p2.lat], Math.max(0,camsZ)); }catch(e){ return null; }
  let best=null, bd=Infinity;
  for(const f of cand){ const px=map.project(f.geometry.coordinates);
    const d=Math.hypot(px.x-point.x, px.y-point.y);
    if(d<=22+(f.properties.cluster?14:0) && d<bd){ bd=d; best=f; } }

}
function bindCamsHandlers(){
  map.on('zoom', camsRender);
  map.on('moveend', ()=>{ if(camsIndex && !camsAnim) camsSet(camsGet(camsZ)); });
  map.on('click','cams__hit',(e)=>{ if(e.features[0]) camsHitAction(e.features[0]); });
  // stale-render guard: rapid layer swaps during the morph's setData churn can leave
  // MapLibre's rendered tiles behind the source, and then a cluster click hit-tests
  // against nothing. If the tile hit-test misses but OUR index (the source of truth we
  // render from) has a pin or cluster under the finger, trust the index and resync.
  map.on('click',(e)=>{
    if(!camsIndex) return;
    const layers=['cams__hit','chi-enf__hit','coverage-hit','coverage-label'].filter(id=>map.getLayer(id));
    if(map.queryRenderedFeatures(e.point,{layers}).length) return;   // normal per-layer handlers took it
    const f=camsAtPoint(e.point);
    if(!f) return;
    camsSet(camsGet(camsZ));                                         // we just proved the renderer stale
    camsHitAction(f);
  });
  ['mousedown','touchstart'].forEach(ev=>map.on(ev,'cams__hit',(e)=>{ const f=e.features[0];
    if(f && !f.properties.cluster) pressFeedback(f.geometry.coordinates.slice(), 11); }));
  map.on('mousemove','cams__hit',(e)=>{ const f=e.features[0]; map.getCanvas().style.cursor='pointer';
    if(f.properties.cluster){ clearHighlight('hover'); hideTip(); }
    else { setHighlight('hover',f.geometry.coordinates.slice(),9); showTip(f.geometry.coordinates.slice(),f.properties.name); } });
  map.on('mouseleave','cams__hit',()=>{ map.getCanvas().style.cursor=''; clearHighlight('hover'); hideTip(); });
}
function addEnfLayers(k,data){ map.addSource(srcId(k),{type:'geojson',data});

// toggling a layer flips visibility rather than destroying it, so pin stacking stays identical

/* ---------- camera health (states/health/<CODE>.json, refreshed by probe-health.py) ---------- */
const healthCache={};

// fetch a layer's sweep verdicts without needing its camera data loaded — the route
// view reads health for layers that may be off
async function fetchHealthRaw(k){
  if(k in healthCache) return healthCache[k];
  const code=healthCode(k); healthCache[k]=null;       // marks the fetch as attempted
  if(!code) return null;
  let h=null;
  try{ const r=await fetch(`states/health/${code}.json`); if(r.ok) h=await r.json(); }catch(e){}
  if(h) healthCache[k]=h;

}
async function loadHealth(k, data){
  const h=await fetchHealthRaw(k);

  LAYERS[k].healthAt=h.checked_at;
  const st=h.status||{};
  for(const f of data.features){
    for(const d of f.properties.directions){
      const s=d.snapshot ? st[snapKey(d.snapshot)] : undefined;
      if(s) d.health=s;
    }

/* the one status seam everything reads: every view and every camera gets a status in
   {live, snapshot, offline, frozen}. Pin styling, popup badges, the age line and route
   tiles derive from it exclusively — future incident detection plugs in right here. */
function applyStatus(k, data){
  const cfg=LAYERS[k], hasVideo=!!cfg.hasVideo;
  let deadViews=0;
  for(const f of data.features){
    const dirs=f.properties.directions; let dead=0, frozen=0;
    for(const d of dirs){
      const playable=!!(d.video && hasVideo);           // a working stream outranks a dead snapshot
      if(d.health && !playable){ d.status = d.health==='frozen' ? 'frozen' : 'offline'; dead++; if(d.status==='frozen') frozen++; }
      else d.status = playable ? 'live' : 'snapshot';
    }
    deadViews+=dead;
    // grey the pin only when every view at this location is dead
    f.properties.status = (dirs.length && dead===dirs.length) ? (frozen===dead?'frozen':'offline')
                        : (dirs.some(d=>d.status==='live') ? 'live' : 'snapshot');
  }
  cfg.deadCount=deadViews;
}
// warm TCP/TLS to the snapshot + video hosts so the first click connects instantly (no feed fetched)
function preconnectFor(data, cfg){
  const hosts=new Set();
  for(const f of data.features.slice(0,60)){ const d=f.properties.directions?.[0]||{};
    [d.snapshot, videoFor(cfg, d)].forEach(u=>{ if(u){ try{ hosts.add(new URL(u).origin); }catch(e){} } }); }
  if(cfg.sign==='tx') hosts.add(TX_ML);                    // the token hop sits in front of the first frame
  hosts.forEach(origin=>{ if(document.querySelector(`link[data-pc="${CSS.escape(origin)}"]`)) return;
    const l=document.createElement('link'); l.rel='preconnect'; l.href=origin; l.crossOrigin=''; l.dataset.pc=origin; document.head.appendChild(l); });
}
async function enableLayer(k,fly=true){

function disableLayer(k){

/* the master "All states" checkbox is a true tri-state, the way Gmail/Sheets do it:
   unchecked = none on, indeterminate dash = some on, checked = all on. It reflects the
   active set, never guesses. Clicking from none/some selects all (the ARIA convention),
   from all deselects all. The enforcement overlay is not a state and is not counted. */
function liveKeys(){ return Object.keys(LAYERS).filter(k=>LAYERS[k].kind==='live'); }
function syncMaster(){
  const m=document.getElementById('masterAll'); if(!m) return;
  // one entry per sidebar row: a folded child (New York City) is not its own state here, and a
  // row is "on" when its parent layer is, since a group always toggles together
  const keys=liveKeys().filter(k=>!foldParent(k)), on=keys.filter(k=>store.activeLayers.has(k)).length;
  m.checked = on>0 && on===keys.length;

async function setAllStates(on){

  const keys=liveKeys();
  // off means off: the view does not pull states back in until one is asked for again
  keys.forEach(k=>{ if(!foldParent(k)) on ? userOff.delete(k) : userOff.add(k); });
  if(on) await Promise.allSettled(keys.map(k=>store.activeLayers.has(k)?null:enableLayer(k,false)));

/* coverage overview markers (one per covered state), sized by and labelled with the
   actual camera count so the zoomed-out map reads as data, not just dots */
function buildCoverage(){
  // one marker per sidebar state; a folded feed (New York City) rolls into its parent's count
  const feats=Object.entries(LAYERS).filter(([k,c])=>c.kind==='live'&&c.center&&!foldParent(k)).map(([k,c])=>{
    const n=groupCount(k);
    return { type:'Feature', geometry:{type:'Point',coordinates:c.center},
      properties:{k, label:c.name, n, nLabel: n>=1000 ? (Math.round(n/100)/10)+'k' : String(n)} };
  });

}
// a state's bubble stands in for its cameras until they load, then steps aside for them, so a
// zoomed-out map shows clusters where states are loaded and one counted bubble everywhere else
const COVERAGE_LAYERS=['coverage-dot','coverage-label','coverage-block','coverage-count','coverage-hit'];
function updateCoverage(){ const hide=(typeof nav!=='undefined' && nav.mode==='dir') ? ['in',['get','k'],['literal',[]]]   // matches nothing: no state bubbles over a route
    : ['!',['in',['get','k'],['literal',[...store.activeLayers]]]];

/* ---------- the view decides which states load ----------
   The first screen used to be a 49-row checklist, which is how the data is stored, not how
   anyone uses a map. Now whatever the map shows at a city or region zoom loads on its own.
   Each state gets a loose box from its outline (padded, because the outline is coarse and a
   ferry or river-bridge camera can sit just outside it; decision 0011). Only the few states
   nearest the middle of the view load per move, so a wide view never pulls ten files. */
const AUTO_Z=6, AUTO_MAX=4, BOX_PAD=0.2;
const stateBoxes={};                                     // sidebar row key -> [w, s, e, n]
const autoPending=new Set();
function buildStateBoxes(outline){
  const byName={};
  Object.keys(LAYERS).forEach(k=>{ if(LAYERS[k].kind==='live' && !foldParent(k)) byName[LAYERS[k].name]=k; });
  for(const f of (outline&&outline.features)||[]){
    const k=byName[f.properties.name]; if(!k) continue;
    let w=Infinity, s=Infinity, e=-Infinity, n=-Infinity;
    const walk=(c)=>{ if(typeof c[0]==='number'){ if(c[0]<w)w=c[0]; if(c[0]>e)e=c[0]; if(c[1]<s)s=c[1]; if(c[1]>n)n=c[1]; } else c.forEach(walk); };

function autoLoadView(){
  if(map.getZoom()<AUTO_Z) return;

  // is distance 0, and among those the smaller state is the one being looked at
  Object.entries(stateBoxes)
    .filter(([,[bw,bs,be,bn]])=> bw<=e && be>=w && bs<=n && bn>=s)
    .map(([k,[bw,bs,be,bn]])=>{ const dx=Math.max(bw-c.lng,0,c.lng-be), dy=Math.max(bs-c.lat,0,c.lat-bn);
      return {k, d:dx*dx+dy*dy, area:(be-bw)*(bn-bs)}; })
    .sort((a,b)=> a.d-b.d || a.area-b.area).slice(0,AUTO_MAX)
    .forEach(({k})=>{
      if(userOff.has(k) || autoPending.has(k) || groupKeys(k).every(g=>store.activeLayers.has(g))) return;

    });

let autoLoadT=null;
function scheduleAutoLoad(){ clearTimeout(autoLoadT); autoLoadT=setTimeout(autoLoadView,250); }

/* ---------- search ---------- */
function rebuildSearchIndex(){ searchIndex=[]; store.activeLayers.forEach(k=>{ const d=dataCache[k]; if(!d) return;
  d.features.forEach(f=>searchIndex.push({name:f.properties.name,road:f.properties.roadway||'',coords:f.geometry.coordinates,k,feature:f})); }); }
// one list of hits in display order, places first, so the mouse, the arrow keys and Enter all

const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function runSearch(q){
  const box=document.getElementById('search-results'), raw=q.trim(); q=raw.toLowerCase(); kbdIdx=-1;
  document.getElementById('searchClear').hidden=!raw;
  if(q.length<2){ box.classList.remove('show'); box.innerHTML=''; searchHits=[]; document.getElementById('panel').classList.remove('searching'); return; }
  const cams=searchIndex.filter(e=>(e.name&&e.name.toLowerCase().includes(q))||(e.road&&e.road.toLowerCase().includes(q))).slice(0,8).map(e=>({kind:'cam',...e}));

  // on, offer the states whose names match — one tap turns the state on and re-searches
  // one hit per sidebar row; match on any name in the group so "new york city" still turns on
  // New York (which carries the city feed), and enable the whole group like the checkbox does
  const states=cams.length ? [] : Object.entries(LAYERS).filter(([k,c])=>c.kind==='live' && !foldParent(k) && !store.activeLayers.has(k)
    && groupKeys(k).some(g=>LAYERS[g].name.toLowerCase().includes(q))).slice(0,4).map(([k,c])=>({kind:'state',k,name:c.name}));
  // places arrive later than cameras; until they do the group says so rather than looking empty
  const placeState=(!navOn || raw.length<3) ? null : placeCache.has(raw) ? 'done' : placeFail.has(raw) ? 'fail' : 'busy';
  // A query that reads like a road ("I-5", "SR 167", "MP 16", "exit 12", any number) is a
  // camera search first: its cameras lead and only the top three places follow, because
  // TomTom's fuzzy matches for road text are loose ("I-5 at MP 16" found a doctor's office).
  // Anything else is a place search first, the way every map app ranks a name.
  const roadish=cams.length>0 && /\d|\b(i|sr|us|hwy|mp|exit)\b/i.test(raw);
  let places=placeState==='done' ? placeCache.get(raw) : [];
  if(roadish) places=places.slice(0,3);
  if(navOn) schedulePlaces(raw);
  searchHits=roadish ? [...cams, ...places, ...states] : [...places, ...cams, ...states];
  const dot=(e)=> e.k==='chi-enf' ? (VERDICT[e.feature.properties.quad]||VERDICT.quiet).color : '#007aff';
  // two lines a row, the way every map app lists results: what it is, then where it is
  const row=(h,i)=>{
    const ic= h.kind==='place' ? `<span class="sr-ic">${ICON.pin}</span>`
            : h.kind==='state' ? `<span class="sr-ic">${ICON.state}</span>`
            : `<span class="sr-ic cam" style="color:${dot(h)}">${ICON.cam}</span>`;
    const t= h.kind==='state' ? `Turn on ${esc(h.name)}` : esc(h.name);
    const sub= h.kind==='place' ? esc(h.address) : h.kind==='state' ? `${groupCount(h.k).toLocaleString()} cameras` : esc(LAYERS[h.k]?.name || h.k);
    return `<div class="sr-item" data-i="${i}">${ic}<span class="sr-txt"><span class="sr-t">${t}</span>${sub?`<span class="sr-s">${sub}</span>`:''}</span></div>`;
  };
  let html='', i=0;
  const placeHTML=()=> places.length ? `<div class="sr-grp">Places <span>TomTom</span></div>`+places.map(h=>row(h,i++)).join('')
    : placeState==='busy' ? `<div class="sr-grp">Places <span>searching…</span></div>`
    : placeState==='fail' ? `<div class="sr-grp">Places <span>TomTom is not answering right now</span></div>` : '';
  const camHTML=()=> cams.length ? ((places.length||placeState)?`<div class="sr-grp">Cameras</div>`:'')+cams.map(h=>row(h,i++)).join('') : '';
  html+=roadish ? camHTML()+placeHTML() : placeHTML()+camHTML();
  if(!cams.length){
    if(states.length) html+=`<div class="sr-empty">No camera matches in the states that are on.</div>`+states.map(h=>row(h,i++)).join('');
    else if(!places.length && placeState!=='busy') html+=`<div class="sr-empty">No matches in the states that are on. Try a state name to turn one on.</div>`;
  }
  box.innerHTML=html; box.classList.add('show'); document.getElementById('panel').classList.add('searching');
  box.querySelectorAll('.sr-item').forEach(it=>it.addEventListener('click',()=>pickSearch(searchHits[+it.dataset.i])));
}
// a pick puts the phone keyboard and the expanded panel away, so the map shows what was picked
function foldSearch(){ document.getElementById('search').blur(); document.getElementById('panel').classList.remove('searching');

/* ---------- route preview (TomTom evaluation, this machine only) ----------
   Search a place or an address, open its card, ask for directions, and compare two or three
   routes by trip time, traffic delay and how many of Ora's cameras sit on each. It is a
   preview: no turn-by-turn, no following your position, no rerouting. Everything here is for
   testing on this machine under TomTom's evaluation terms. It turns on only when the page
   itself is served from localhost and the local proxy (tools/tomtom-eval/proxy.js, which holds
   the key) answers, so the live site never calls TomTom. The proxy hands back Ora's own small
   shapes, so another provider can replace it.

   The flow and the map copy what people already know from Google Maps, Apple Maps and Waze:
   a place card with one Directions button; a From/To pair with a swap button; routes listed by
   time (coloured by traffic), the roads they take and the cameras on them; the chosen route
   drawn thick and blue with its slow stretches coloured, the others grey; a time bubble pinned
   to each route, tap one to choose it; and the map zooming to the chosen route clear of the
   panel and the sheet. While routes are up, only the chosen route's cameras show. */

const FC=(features)=>({type:'FeatureCollection',features});
async function navGet(path){
  const r=await fetch(NAV_BASE+path), j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||`HTTP ${r.status}`);
  return j;
}
async function navInit(){

  // alternatives under the chosen route, the chosen route under its own traffic colours, and
  // every route under the camera pins so the cameras on it stay tappable

  map.addLayer({id:'nav-sel-casing',type:'line',source:'nav-routes',filter:['==',['get','sel'],1],layout:line,paint:{'line-color':'#0b4fb3','line-width':w(8,13,18)}},'cams__clusters');
  map.addLayer({id:'nav-sel',type:'line',source:'nav-routes',filter:['==',['get','sel'],1],layout:line,paint:{'line-color':'#1a73e8','line-width':w(5,9,13)}},'cams__clusters');
  map.addLayer({id:'nav-traffic',type:'line',source:'nav-traffic',layout:line,paint:{'line-color':['match',['get','level'],'jam','#d93025','closed','#7a1712','#f29900'],'line-width':w(5,9,13)}},'cams__clusters');

    if(f && !map.queryRenderedFeatures(e.point,{layers:['cams__hit']}).length) selectRoute(f.properties.i); });

// wait for a pause in typing (the free allowance for place search is 2,500 a month), and
// search near the middle of the map so "main st" means the one you are looking at
function schedulePlaces(q){
  if(q.length<3 || placeCache.has(q) || placeBusy.has(q) || placeFail.has(q)) return;
  clearTimeout(placeT);
  placeT=setTimeout(async ()=>{
    placeBusy.add(q);
    const c=map.getCenter();
    try{ placeCache.set(q, (await navGet(`/search?q=${encodeURIComponent(q)}&near=${c.lat.toFixed(5)},${c.lng.toFixed(5)}`)).places.map(p=>({...p, kind:'place'}))); }
    catch(e){ placeFail.add(q); console.warn('place search failed:', e.message); }
    placeBusy.delete(q);
    // whichever box asked, the main search or a From/To field, redraws if it still shows this query
    const a=document.activeElement;
    if(a && a.id==='search' && a.value.trim()===q) runSearch(a.value);
    if(a && a.classList.contains('dir-field') && a.value.trim()===q) renderSuggest(a);
  }, 350);
}
const placeState=(q)=> q.length<3 ? null : placeCache.has(q) ? 'done' : placeFail.has(q) ? 'fail' : 'busy';

/* --- the place card --- */
function navBox(){ return document.getElementById('dirBox'); }
function setPanelMode(mode){
  const p=document.getElementById('panel');
  p.classList.toggle('nav-place', mode==='place'); p.classList.toggle('nav-dir', mode==='dir');
  navBox().hidden=!(mode==='dir' || (mode==='place' && !isMobile()));
  updateCoverage();
}
function placeMarker(lngLat){
  if(!nav.marker) nav.marker=new maplibregl.Marker({color:'#d93025'});
  nav.marker.setLngLat(lngLat).addTo(map);
}
function pickPlace(p){ showPlace(p); }
function showPlace(p){
  clearSelection();
  nav.mode='place'; nav.place=p; nav.routes=[]; nav.token++;
  placeMarker([p.lon,p.lat]);
  // the place sits in the middle of the map that is left over beside the panel or above the sheet
  const off=isMobile() ? [0,-90] : [Math.round(document.getElementById('panel').getBoundingClientRect().right/2),0];
  // a tap on the map keeps the zoom you chose and only slides the place clear of the panel or sheet
  if(p.fromTap) map.easeTo({center:[p.lon,p.lat],offset:off,duration:500});
  else if(p.bbox && !/POI|Address/.test(p.type||'')) map.fitBounds([[p.bbox[0],p.bbox[1]],[p.bbox[2],p.bbox[3]]],{maxZoom:15,padding:framePad(),duration:800});
  else map.flyTo({center:[p.lon,p.lat],zoom:Math.max(map.getZoom(),15),offset:off,duration:800});
  const html=`<div class="place-card"><div class="pc-head"><div class="pc-txt"><h3>${esc(p.name)}</h3>
        <div class="pc-cat" data-cat>${esc(humanCat(p.category))}</div><div class="place-addr" data-addr>${esc(p.address||'')}</div></div>
      ${isMobile()?'':`<button class="nav-ic" data-close aria-label="Close">${ICON.close}</button>`}</div>
    <div class="pc-meta"><span data-drive></span><span data-near></span></div>
    ${navOn ? `<button class="place-go" data-dir>${ICON.car}<span>Directions</span><span class="pg-time" data-gotime></span></button>` : ''}
    <div class="pc-rows" data-rows></div><div class="pc-src" data-src></div></div>`;
  let el;
  if(isMobile()){ setPanelMode('place'); openSheet(html); el=document.getElementById('sheetContent'); }
  else { navBox().innerHTML=html; setPanelMode('place'); el=navBox(); }
  const go=el.querySelector('[data-dir]'); if(go) go.addEventListener('click',startDirections);
  const x=el.querySelector('[data-close]'); if(x) x.addEventListener('click',closeNav);
  placeExtras(p);
}
function setPlaceMeta(key, html){
  const host=isMobile() ? document.getElementById('sheetContent') : navBox();
  const el=host && host.querySelector(`[data-${key}]`); if(el) el.innerHTML=html;
}
// the extras fill in as they land: cameras near the place from Ora's own data, and the drive
// time from one route call, which Directions then reuses instead of asking again
async function placeExtras(p){
  const tok=++nav.ptok, at=[p.lon,p.lat];
  const info=await overtureMatch(p);
  if(tok!==nav.ptok || nav.mode!=='place') return;
  if(info) fillPlace(p, info);
  await Promise.allSettled(statesAt(at).map(k=>enableGroup(k,false)));
  if(tok!==nav.ptok || nav.mode!=='place') return;
  const near=countNear(at, 1609);
  setPlaceMeta('near', `${ICON.cam}${near ? `${near} camera${near===1?'':'s'} within 1 mi` : 'No cameras within 1 mi'}`);
  if(!meMarker || !navOn) return;             // a drive time needs a start and the routing proxy; never ask for location just for this
  const from=meMarker.getLngLat().toArray();
  try{
    const routes=(await navGet(routeQuery(from,at))).routes;
    if(tok!==nav.ptok || nav.mode!=='place' || !routes.length) return;
    nav.pre={key:routeKey(from,at), routes, at:Date.now()};
    const best=Math.min(...routes.map(r=>r.seconds));
    setPlaceMeta('drive', `${fmtTime(best)} drive · ${fmtMiles(routes.find(r=>r.seconds===best).meters)}`);
    setPlaceMeta('gotime', fmtTime(best));
  }catch(e){}
}
const humanCat=(c)=> c ? String(c).replace(/_/g,' ').replace(/^./,ch=>ch.toUpperCase()) : '';
// the rest of a card from Overture: what kind of place, where, how to reach it, and who says so
function fillPlace(p, o){
  p.phone=o.phone; p.website=o.website;
  if(o.category) setPlaceMeta('cat', esc(humanCat(o.category)));
  if(!p.address){ const a=[o.street, [o.city, [o.region, o.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ')].filter(Boolean).join(', ');
    if(a){ p.address=a; setPlaceMeta('addr', esc(a)); } }
  const rows=[];
  if(o.phone){ const d=String(o.phone).replace(/[^\d+]/g,''), us=d.replace(/^\+?1(?=\d{10}$)/,'');
    const shown=/^\d{10}$/.test(us) ? `(${us.slice(0,3)}) ${us.slice(3,6)}-${us.slice(6)}` : o.phone;
    rows.push(`<a href="tel:${esc(d)}">${ICON.phone}<span>${esc(shown)}</span></a>`); }
  if(o.website){ let host=o.website; try{ host=new URL(o.website).hostname.replace(/^www\./,''); }catch(e){}
    if(/^https?:/i.test(o.website)) rows.push(`<a href="${esc(o.website)}" target="_blank" rel="noopener">${ICON.web}<span>${esc(host)}</span></a>`); }
  setPlaceMeta('rows', rows.join(''));
  setPlaceMeta('src', `Details from <a href="https://docs.overturemaps.org/attribution/" target="_blank" rel="noopener">Overture Maps Foundation</a>`);
}
function countNear([lng,lat], m){
  const kx=111320*Math.cos(lat*Math.PI/180); let n=0;
  for(const k of statesAt([lng,lat]).flatMap(groupKeys)) if(dataCache[k]) for(const f of dataCache[k].features){
    const [x,y]=f.geometry.coordinates; if(Math.hypot((x-lng)*kx,(y-lat)*110540)<=m) n++; }
  return n;
}

/* --- tapping the map, and the place details behind it ---
   Tap a landmark and its card opens, the way every map app does: the name and kind come
   straight from the map tile, and Overture Maps Places (built into places/ by
   builders/build-places.py, one small file per zoom-15 tile) fills in the address, phone and
   website. A tap on empty map closes the card. Ora's own pins, bubbles and route lines answer
   a tap first, and while routes are up taps belong to the routes. */
// The place files are built on this machine and not hosted anywhere public yet, so the live
// site does not look for them (each look would log a 404); there a card keeps the map tile's
// name and kind and the cameras near it.
const PLACES={index:undefined, tiles:new Map(), on:/^(localhost|127\.0\.0\.1)$/.test(location.hostname)};
async function placesIndex(){
  if(!PLACES.on) return null;
  if(PLACES.index===undefined){ try{ const r=await fetch('places/index.json'); PLACES.index=r.ok ? await r.json() : null; }catch(e){ PLACES.index=null; } }
  return PLACES.index;
}
function tileXY(lon, lat, z){
  const n=2**z, r=lat*Math.PI/180;
  return [Math.floor((lon+180)/360*n), Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)];
}
function placesTile(z, x, y){
  const k=`${z}/${x}/${y}`;
  if(!PLACES.tiles.has(k)) PLACES.tiles.set(k, fetch(`places/${k}.json`).then(r=>r.ok ? r.json() : []).catch(()=>[]));
  return PLACES.tiles.get(k);
}
// every Overture place within m metres, from the one to four tiles that box touches
async function placesNear(lon, lat, m){
  const ix=await placesIndex(); if(!ix) return [];
  const dLat=m/110540, dLon=m/(111320*Math.cos(lat*Math.PI/180));
  const [x0,y0]=tileXY(lon-dLon, lat+dLat, ix.z), [x1,y1]=tileXY(lon+dLon, lat-dLat, ix.z), jobs=[];
  for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) jobs.push(placesTile(ix.z,x,y));
  return (await Promise.all(jobs)).flat().map(r=>Object.fromEntries(ix.fields.map((f,i)=>[f,r[i]])));
}
const normName=(s)=>String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/&/g,' and ')
  .replace(/[^a-z0-9]+/g,' ').replace(/\b(the|of)\b/g,' ').replace(/\s+/g,' ').trim();
// Words that make a longer name a different thing at the same spot: "Space Needle Observation
// Deck Parking" is a car park, not the deck, and must not lend the deck its category or website.
const FACILITY=/\b(parking|garage|lot|atm|station|stop|entrance|exit|gate|lobby|dock|terminal|office|kiosk|annex)\b/;
function nameSim(a, b){
  a=normName(a); b=normName(b); if(!a || !b) return 0; if(a===b) return 1;
  const A=new Set(a.split(' ')), B=new Set(b.split(' ')); let both=0; A.forEach(t=>{ if(B.has(t)) both++; });
  const extra=[...A].filter(t=>!B.has(t)).concat([...B].filter(t=>!A.has(t))).join(' ');
  if(FACILITY.test(extra)) return 0;
  return both/(A.size+B.size-both);                    // shared words over all words: 4 of 5 is 0.8
}
// the Overture place a tap or a search pick means: the same name (or near enough) within 150 m,
// preferring the closer and the surer one. A name match is required, so a tap on one shop never
// borrows the phone number of its neighbour.
async function overtureMatch(p){
  const kx=111320*Math.cos(p.lat*Math.PI/180); let best=null, top=0;
  for(const c of await placesNear(p.lon, p.lat, 150)){
    const sim=nameSim(p.name, c.name); if(sim<0.6) continue;
    const d=Math.hypot((c.lon-p.lon)*kx, (c.lat-p.lat)*110540), score=sim - d/600 + (c.confidence||0)*0.2;
    if(score>top){ top=score; best=c; }
  }
  return best;
}
// the nearest named landmark under a finger, from the map tile's own points of interest
function poiAt(point){
  const r=12; let best=null, bd=Infinity;
  for(const f of map.queryRenderedFeatures([[point.x-r,point.y-r],[point.x+r,point.y+r]])){
    if(f.sourceLayer!=='poi' || !f.properties.name || f.geometry.type!=='Point') continue;
    const px=map.project(f.geometry.coordinates), d=Math.hypot(px.x-point.x, px.y-point.y);
    if(d<bd){ bd=d; best=f; }
  }
  return best;
}
const OWN_LAYERS=['cams__hit','chi-enf__hit','coverage-hit','coverage-label','nav-hit'];
const ownAt=(point)=>map.queryRenderedFeatures(point,{layers:OWN_LAYERS.filter(id=>map.getLayer(id))}).length>0;
function bindMapTaps(){
  map.on('click',(e)=>{
    if(preview || nav.mode==='dir' || ownAt(e.point)) return;
    const f=poiAt(e.point);
    if(!f){ if(nav.mode==='place') closeNav(); return; }
    const pr=f.properties, [lon,lat]=f.geometry.coordinates;
    document.getElementById('search').value=pr.name; document.getElementById('searchClear').hidden=false;
    showPlace({name:pr.name, category:pr.subclass||pr.class, lon, lat, address:'', fromTap:true});
  });
  // the pointer turns into a hand over anything a tap would open
  let raf=0, onPoi=false;
  map.on('mousemove',(e)=>{ if(raf) return; raf=requestAnimationFrame(()=>{ raf=0;
    const hit=nav.mode!=='dir' && !ownAt(e.point) && !!poiAt(e.point);
    if(hit!==onPoi){ onPoi=hit; map.getCanvas().style.cursor=hit ? 'pointer' : ''; } }); });
}

/* --- directions --- */
// your position for "From": the dot's last fix if it is on the map, otherwise one fresh ask
function myPosition(){
  if(meMarker){ const l=meMarker.getLngLat(); return Promise.resolve([l.lng,l.lat]); }
  if(!navigator.geolocation) return Promise.resolve(null);
  return new Promise(res=>navigator.geolocation.getCurrentPosition(
    (pos)=>{ showMe(pos,false); res([pos.coords.longitude,pos.coords.latitude]); }, ()=>res(null),
    {enableHighAccuracy:true, timeout:10000, maximumAge:60000}));
}
const routeKey=(a,b)=>[...a,...b].map(v=>v.toFixed(4)).join(',');
const routeQuery=(a,b)=>`/route?from=${a[1].toFixed(6)},${a[0].toFixed(6)}&to=${b[1].toFixed(6)},${b[0].toFixed(6)}`;
async function startDirections(){
  const p=nav.place; if(!p) return;
  clearSelection();                                   // the phone's place sheet gives way to the route sheet
  nav.mode='dir'; nav.to={lngLat:[p.lon,p.lat], label:p.name};
  if(!nav.from){ const me=await myPosition(); nav.from= me ? {lngLat:me, label:'Your location', me:true} : null; }
  renderDir();
  if(!nav.from){ focusField('from'); return; }
  planRoutes();
}
function renderDir(){
  setPanelMode('dir');
  navBox().innerHTML=`<div class="dir-top"><button class="nav-ic" data-back aria-label="Back">${ICON.back}</button><div class="dir-mode">${ICON.car}<span>Drive</span></div></div>
    <div class="dir-stack"><div class="dir-rail"><span class="rail-from"></span><span class="rail-dots"></span><span class="rail-to">${ICON.pin}</span></div>
      <div class="dir-fields">
        <input class="dir-field" data-end="from" autocomplete="off" spellcheck="false" placeholder="Choose a starting point" aria-label="Start" value="${esc(nav.from?nav.from.label:'')}">
        <input class="dir-field" data-end="to" autocomplete="off" spellcheck="false" placeholder="Choose a destination" aria-label="Destination" value="${esc(nav.to?nav.to.label:'')}"></div>
      <button class="nav-ic" data-swap aria-label="Swap start and destination" title="Swap">${ICON.swap}</button></div>
    <div id="dirSuggest"></div>${isMobile()?'':'<div id="dirRoutes"></div>'}`;
  const box=navBox();
  box.querySelector('[data-back]').addEventListener('click',navBack);
  box.querySelector('[data-swap]').addEventListener('click',()=>{
    if(!nav.from || !nav.to) return;
    [nav.from, nav.to]=[nav.to, nav.from]; renderDir(); planRoutes(); });
  box.querySelectorAll('.dir-field').forEach(f=>{
    // on a phone the route sheet steps aside while a field is being edited, so the suggestions show
    f.addEventListener('focus',()=>{ nav.editing=f.dataset.end; document.body.classList.add('dir-editing'); f.select(); renderSuggest(f); });
    f.addEventListener('input',()=>renderSuggest(f));
    f.addEventListener('keydown',(e)=>{
      if(e.key==='Enter'){ e.preventDefault(); const first=document.querySelector('#dirSuggest .sr-item'); if(first) first.dispatchEvent(new Event('pointerdown')); }
      if(e.key==='Escape'){ e.preventDefault(); f.blur(); } });
    // leaving a field without picking puts back what it held
    f.addEventListener('blur',()=>setTimeout(()=>{ if(nav.editing!==f.dataset.end || document.activeElement===f) return;
      nav.editing=null; document.body.classList.remove('dir-editing');
      const v=nav[f.dataset.end]; f.value=v?v.label:''; document.getElementById('dirSuggest').innerHTML=''; },120));
  });
  const sheet=document.getElementById('dirSheet'); sheet.classList.toggle('open', isMobile());
  renderRoutes();
}
function focusField(end){ const f=navBox().querySelector(`.dir-field[data-end="${end}"]`); if(f) f.focus(); }
function renderSuggest(field){
  const box=document.getElementById('dirSuggest'); if(!box) return;
  const q=field.value.trim(), end=field.dataset.end, hits=[];
  if(end==='from') hits.push({kind:'me', name:'Your location'});
  const st=placeState(q);
  if(st==='done') hits.push(...placeCache.get(q)); else if(st==='busy') schedulePlaces(q);
  box.innerHTML=hits.map((h,i)=>`<div class="sr-item" data-i="${i}"><span class="sr-ic${h.kind==='me'?' me':''}">${h.kind==='me'?ICON.me:ICON.pin}</span>
      <span class="sr-txt"><span class="sr-t">${esc(h.name)}</span>${h.address?`<span class="sr-s">${esc(h.address)}</span>`:''}</span></div>`).join('')
    + (st==='busy' ? `<div class="sr-empty">Searching places…</div>` : st==='fail' ? `<div class="sr-empty">TomTom is not answering right now</div>` : '');
  // pointerdown, not click: picking must win the race with the field's blur
  box.querySelectorAll('.sr-item').forEach(it=>it.addEventListener('pointerdown',(e)=>{ e.preventDefault(); setEnd(end, hits[+it.dataset.i]); }));
}
async function setEnd(end, hit){
  let v;
  if(hit.kind==='me'){ const me=await myPosition(); if(!me){ flashCycleNotice('Location is off for this site, so pick a place instead'); return; }
    v={lngLat:me, label:'Your location', me:true}; }
  else v={lngLat:[hit.lon,hit.lat], label:hit.name};
  nav[end]=v; nav.editing=null; document.body.classList.remove('dir-editing');
  if(end==='to' && hit.kind==='place') nav.place=hit;
  renderDir();
  if(nav.from && nav.to) planRoutes(); else focusField(nav.from ? 'to' : 'from');
}
async function planRoutes(){
  const tok=++nav.token, from=nav.from.lngLat, to=nav.to.lngLat;
  nav.routes=[]; nav.sel=0; camFocus=new Set(); buildCamsIndex();    // no stray pins while routes load
  drawRouteMap(); renderRoutes('Finding routes…');
  if(nav.from.me){ if(nav.origin) nav.origin.remove(); }
  else { if(!nav.origin){ const el=document.createElement('div'); el.className='nav-origin'; nav.origin=new maplibregl.Marker({element:el}); } nav.origin.setLngLat(from).addTo(map); }
  placeMarker(to);
  let routes;
  const key=routeKey(from,to);
  if(nav.pre && nav.pre.key===key && Date.now()-nav.pre.at<300000) routes=nav.pre.routes;     // the place card already asked
  else{
    try{ routes=(await navGet(routeQuery(from,to))).routes; }
    catch(e){ if(tok===nav.token) renderRoutes(`Could not get routes: ${e.message}`); return; }
  }
  if(tok!==nav.token) return;
  if(!routes.length){ renderRoutes('No route found between these two points'); return; }
  const fastest=Math.min(...routes.map(r=>r.seconds));
  nav.routes=routes.map(r=>({...r, cams:null}));
  nav.sel=nav.routes.findIndex(r=>r.seconds===fastest);
  drawRouteMap(); renderRoutes(); frameRoutes(true);
  routeCameras(tok);
}
function clearRouteMap(){
  nav.callouts.forEach(m=>m.remove()); nav.callouts=[];
  ['nav-routes','nav-traffic'].forEach(id=>{ const s=map.getSource(id); if(s) s.setData(FC([])); });
}
function drawRouteMap(){
  if(!map.getSource('nav-routes')) return;
  clearRouteMap();
  map.getSource('nav-routes').setData(FC(nav.routes.map((r,i)=>({type:'Feature',properties:{i,sel:i===nav.sel?1:0},geometry:{type:'LineString',coordinates:r.coords}}))));
  const r=nav.routes[nav.sel];
  map.getSource('nav-traffic').setData(FC(r ? r.traffic.map(t=>({type:'Feature',properties:{level:t.level},
    geometry:{type:'LineString',coordinates:r.coords.slice(t.from,t.to+1)}})) : []));
  const fastest=nav.routes.length ? Math.min(...nav.routes.map(x=>x.seconds)) : 0;
  nav.routes.forEach((rt,i)=>{
    const el=document.createElement('div'); el.className='rt-callout'+(i===nav.sel?' sel':'');
    el.innerHTML=`${fmtTime(rt.seconds)}${nav.routes.length>1 && rt.seconds===fastest?'<small>Fastest</small>':''}`;
    el.addEventListener('click',(e)=>{ e.stopPropagation(); selectRoute(i); });
    if(i===nav.sel) el.style.zIndex='2';               // the chosen route's bubble sits on top where bubbles meet
    nav.callouts.push(new maplibregl.Marker({element:el, anchor:'bottom', offset:[0,-4]}).setLngLat(calloutPoint(i)).addTo(map));
  });
}
// a route's bubble goes in the middle of the longest stretch that no other route shares, so
// each bubble clearly belongs to its own line (Google and Mapbox place theirs the same way)
function calloutPoint(i){
  const r=nav.routes[i], shared=new Set(), key=([x,y])=>`${x.toFixed(4)},${y.toFixed(4)}`;
  nav.routes.forEach((o,j)=>{ if(j!==i) for(const c of o.coords) shared.add(key(c)); });
  let best=null, start=-1, len=0, bestLen=-1;
  const seg=(a,b)=>Math.hypot((b[0]-a[0])*Math.cos(a[1]*Math.PI/180),b[1]-a[1]);
  r.coords.forEach((c,k)=>{
    if(shared.has(key(c))){ start=-1; return; }
    if(start<0){ start=k; len=0; } else len+=seg(r.coords[k-1],c);
    if(len>bestLen){ bestLen=len; best=[start,k]; }
  });
  if(!best || best[1]===best[0]) return r.coords[Math.floor(r.coords.length/2)];
  // walk to the halfway distance of that stretch
  let half=bestLen/2, k=best[0];
  while(k<best[1] && half>0){ half-=seg(r.coords[k],r.coords[k+1]); k++; }
  return r.coords[k];
}
// the room the map has left once the panel (desktop) or the sheet (phone) is drawn over it
function framePad(){
  const p=document.getElementById('panel').getBoundingClientRect();
  if(isMobile()){
    const s=document.getElementById('dirSheet'), sh=s.classList.contains('open') ? s.offsetHeight : 0;
    return {top:Math.round(p.bottom)+20, bottom:sh+28, left:30, right:30};
  }
  return {top:60, bottom:50, left:Math.round(p.right)+50, right:80};
}
// all routes when they first come back, then the chosen one whenever it changes, the way the
// big apps zoom to the route you pick
function frameRoutes(all){
  const rs=all ? nav.routes : [nav.routes[nav.sel]]; if(!rs.length || !rs[0]) return;
  let w=Infinity,s=Infinity,e=-Infinity,n=-Infinity;
  for(const r of rs) for(const [x,y] of r.coords){ if(x<w)w=x; if(x>e)e=x; if(y<s)s=y; if(y>n)n=y; }
  map.fitBounds([[w,s],[e,n]],{padding:framePad(),duration:900,maxZoom:15});
}
function selectRoute(i){
  if(!nav.routes[i]) return;
  nav.sel=i; drawRouteMap(); renderRoutes();
  const r=nav.routes[i]; if(r.cams){ camFocus=new Set(r.cams.map(c=>c.k+'/'+c.i)); buildCamsIndex(); }
  frameRoutes(false);
}
function closeNav(){
  stopPreview(false); nav.token++; nav.ptok++; nav.mode=null; nav.place=null; nav.from=null; nav.to=null; nav.routes=[]; nav.editing=null;
  clearRouteMap(); if(nav.marker) nav.marker.remove(); if(nav.origin) nav.origin.remove();
  camFocus=null; buildCamsIndex();
  clearSelection(); document.getElementById('dirSheet').classList.remove('open');
  navBox().innerHTML=''; setPanelMode(null);
  const s=document.getElementById('search'); s.value=''; document.getElementById('searchClear').hidden=true;
}
// back from directions lands on the destination's card, the way Apple Maps steps back
function navBack(){
  if(nav.mode==='dir' && nav.place){
    nav.token++; nav.routes=[]; nav.from=null; clearRouteMap(); if(nav.origin) nav.origin.remove();
    camFocus=null; buildCamsIndex(); document.getElementById('dirSheet').classList.remove('open');
    document.getElementById('search').value=nav.place.name; showPlace(nav.place);
  } else closeNav();
}

/* the cameras on a route: every camera within ALONG_M of the line, in driving order. The
   states the line crosses load first, then each camera is checked only against the route
   segments in its own grid cell, so a cross-country route against thousands of cameras stays
   quick. */
const ALONG_M=120, CELL=0.01;
function statesAt([lng,lat]){ return Object.keys(stateBoxes).filter(k=>{ const b=stateBoxes[k]; return lng>=b[0] && lng<=b[2] && lat>=b[1] && lat<=b[3]; }); }
async function routeCameras(tok){
  const ks=new Set();
  for(const r of nav.routes){ const step=Math.max(1,Math.floor(r.coords.length/400));
    for(let i=0;i<r.coords.length;i+=step) statesAt(r.coords[i]).forEach(k=>ks.add(k));
    statesAt(r.coords[r.coords.length-1]).forEach(k=>ks.add(k)); }
  await Promise.allSettled([...ks].map(k=>enableGroup(k,false)));
  if(tok!==nav.token) return;
  const layers=[...ks].flatMap(groupKeys).filter(g=>dataCache[g]);
  for(const r of nav.routes) r.cams=camerasAlong(r.coords, layers);
  const sel=nav.routes[nav.sel]; camFocus=new Set(sel.cams.map(c=>c.k+'/'+c.i)); buildCamsIndex();
  renderRoutes();
}
function camerasAlong(coords, layers){
  const M_LAT=110540, mLon=(lat)=>111320*Math.cos(lat*Math.PI/180);
  const cum=[0];                                       // metres from the start to each point
  for(let i=1;i<coords.length;i++){ const [x0,y0]=coords[i-1], [x1,y1]=coords[i];
    cum.push(cum[i-1]+Math.hypot((x1-x0)*mLon(y0),(y1-y0)*M_LAT)); }
  const grid=new Map(), padLat=ALONG_M/M_LAT;
  for(let i=1;i<coords.length;i++){ const [x0,y0]=coords[i-1], [x1,y1]=coords[i], padLon=ALONG_M/mLon(y0);
    for(let cx=Math.floor((Math.min(x0,x1)-padLon)/CELL); cx<=Math.floor((Math.max(x0,x1)+padLon)/CELL); cx++)
      for(let cy=Math.floor((Math.min(y0,y1)-padLat)/CELL); cy<=Math.floor((Math.max(y0,y1)+padLat)/CELL); cy++){
        const key=cx+','+cy; let a=grid.get(key); if(!a) grid.set(key,a=[]); a.push(i); } }
  const out=[];
  for(const k of layers) dataCache[k].features.forEach((f,fi)=>{
    const [px,py]=f.geometry.coordinates, segs=grid.get(Math.floor(px/CELL)+','+Math.floor(py/CELL)); if(!segs) return;
    const kx=mLon(py); let best=Infinity, along=0;
    for(const i of segs){ const [x0,y0]=coords[i-1], [x1,y1]=coords[i];
      const ax=(x1-x0)*kx, ay=(y1-y0)*M_LAT, bx=(px-x0)*kx, by=(py-y0)*M_LAT, L=ax*ax+ay*ay;
      const t=L ? Math.max(0,Math.min(1,(ax*bx+ay*by)/L)) : 0, d=Math.hypot(bx-ax*t, by-ay*t);
      if(d<best){ best=d; along=cum[i-1]+t*Math.sqrt(L); } }
    if(best<=ALONG_M) out.push({k, i:fi, along, down:['offline','frozen'].includes(f.properties.status)});
  });
  return out.sort((a,b)=>a.along-b.along);
}
const fmtTime=(s)=>{ const m=Math.max(1,Math.round(s/60)); return m<60 ? `${m} min` : `${Math.floor(m/60)} h ${m%60} min`; };
const fmtMiles=(m)=>`${(m/1609.344).toFixed(m<16093?1:0)} mi`;
// a time is green when traffic adds little, orange when it adds a quarter, red past that,
// the colours Google uses for the same thing
function trafficClass(r){ const late=r.delaySeconds, ratio=late/Math.max(1,r.seconds-late); return late<60||ratio<0.1 ? 't-ok' : ratio<0.25 ? 't-slow' : 't-jam'; }
function renderRoutes(msg){
  const box=isMobile() ? document.querySelector('#dirSheet .ds-body') : document.getElementById('dirRoutes'); if(!box) return;
  const fastest=nav.routes.length ? Math.min(...nav.routes.map(r=>r.seconds)) : 0;
  const rows=msg ? `<div class="dir-msg">${esc(msg)}</div>` : !nav.from ? `<div class="dir-msg">Choose a starting point to see routes.</div>` : nav.routes.map((r,i)=>{
    const sel=i===nav.sel, tc=trafficClass(r), down=r.cams ? r.cams.filter(c=>c.down).length : 0;
    const diff=r.seconds-fastest;
    const l3=(nav.routes.length>1 && diff<30 ? '<span class="rt-badge">Fastest</span>' : diff>=30 ? `<span class="rt-dim">${fmtTime(diff)} slower</span>` : '')
      + (r.delaySeconds>=60 ? `<span class="rt-late ${tc}">+${fmtTime(r.delaySeconds)} from traffic</span>` : '<span class="rt-dim">No traffic delays</span>');
    const cams=r.cams==null ? `${ICON.cam}<span class="rt-dim">Finding cameras on this route…</span>`
      : `${ICON.cam}<span>${r.cams.length} camera${r.cams.length===1?'':'s'} on this route${down?` · ${down} not working`:''}</span>`;
    return `<div class="rt-row${sel?' sel':''}" role="button" tabindex="0" data-rt="${i}" aria-pressed="${sel}">
      <div class="rt-l1"><span class="rt-time ${tc}">${fmtTime(r.seconds)}</span><span class="rt-dist">${fmtMiles(r.meters)}</span></div>
      ${r.via && r.via.length ? `<div class="rt-via">via ${esc(r.via.join(', '))}</div>` : ''}
      <div class="rt-l3">${l3}</div><div class="rt-cams">${cams}</div>
      ${sel ? `<div class="rt-actions">${r.cams && r.cams.length ? `<button class="rt-watch" data-watch>${ICON.cam}Watch these ${r.cams.length} cameras</button>` : ''}
        <button class="rt-watch rt-preview" data-preview>${ICON.play}Preview</button></div>` : ''}</div>`;
  }).join('');
  box.innerHTML=rows+`<div class="dir-note">A route preview, not turn-by-turn. Places, routes and traffic &copy; TomTom.</div>`;
  box.querySelectorAll('[data-rt]').forEach(c=>{ const go=()=>selectRoute(+c.dataset.rt);
    c.addEventListener('click',(e)=>{ if(!e.target.closest('[data-watch]')) go(); });
    c.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } }); });
  const w=box.querySelector('[data-watch]'); if(w) w.addEventListener('click',()=>watchRoute(nav.routes[nav.sel]));
  const pv=box.querySelector('[data-preview]'); if(pv) pv.addEventListener('click',(e)=>{ e.stopPropagation(); startPreview(); });
}

/* Preview: the close-up the big apps show once you set off, without following anyone. The map
   tilts down to the start of the chosen route and rides the line to the end (about 0.6 s a
   kilometre, 15 to 45 s), heading the way the road goes, past the cameras on it, then pulls
   back to the whole route. It replays the route's geometry only: no turn instructions and no
   position, so it stays a preview. Any touch on the map, Esc or Stop ends it. */
let preview=null;
function startPreview(){
  const r=nav.routes[nav.sel]; if(!r || r.coords.length<2) return;
  stopPreview(false);
  const pts=r.coords, kx=(lat)=>111320*Math.cos(lat*Math.PI/180), cum=[0];
  for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot((pts[i][0]-pts[i-1][0])*kx(pts[i][1]),(pts[i][1]-pts[i-1][1])*110540));
  const total=cum[cum.length-1];
  const at=(d)=>{ d=Math.max(0,Math.min(total,d)); let lo=0, hi=cum.length-1;
    while(hi-lo>1){ const m=(lo+hi)>>1; if(cum[m]<=d) lo=m; else hi=m; }
    const t=cum[hi]>cum[lo] ? (d-cum[lo])/(cum[hi]-cum[lo]) : 0;
    return [pts[lo][0]+(pts[hi][0]-pts[lo][0])*t, pts[lo][1]+(pts[hi][1]-pts[lo][1])*t]; };
  const heading=(a,b)=>{ const y=(b[0]-a[0])*Math.cos(a[1]*Math.PI/180), x=b[1]-a[1]; return Math.atan2(y,x)*180/Math.PI; };
  const dur=Math.min(45000, Math.max(15000, total/1000*600));
  preview={raf:0, off:null};
  document.body.classList.add('previewing');
  document.getElementById('previewTxt').textContent=`Previewing ${fmtTime(r.seconds)}${r.via&&r.via.length?` via ${r.via[0]}`:''}`;
  let brg=heading(pts[0], at(400));
  map.flyTo({center:pts[0], zoom:15.2, pitch:55, bearing:brg, duration:1800, essential:true});
  map.once('moveend',()=>{
    if(!preview) return;
    const t0=performance.now();
    const tick=(now)=>{
      if(!preview) return;
      const d=(now-t0)/dur*total, p=at(d);
      // turn smoothly toward a point a little way ahead, so the view does not jerk at every bend
      const want=heading(p, at(d+450)); let diff=((want-brg+540)%360)-180; brg+=diff*0.06;
      map.jumpTo({center:p, bearing:brg});
      if(d>=total){ stopPreview(true); return; }
      preview.raf=requestAnimationFrame(tick);
    };
    preview.raf=requestAnimationFrame(tick);
  });
  // a person taking hold of the map ends the ride on the spot
  const grab=()=>stopPreview(false);
  ['mousedown','touchstart','wheel'].forEach(ev=>map.getCanvas().addEventListener(ev,grab,{once:true}));
  preview.off=()=>['mousedown','touchstart','wheel'].forEach(ev=>map.getCanvas().removeEventListener(ev,grab));
}
function stopPreview(reframe=true){
  if(!preview) return;
  cancelAnimationFrame(preview.raf); preview.off(); preview=null;
  document.body.classList.remove('previewing');
  map.easeTo({pitch:0, bearing:0, duration:500});
  if(reframe) map.once('moveend',()=>frameRoutes(false));
}
// the cameras on a route become one of your saved routes, which opens as the scrolling stack
// of live feeds the route view already is; asking twice reopens the same one
function watchRoute(r){
  const key=`${nav.to.label}|${r.seconds}|${r.meters}`;
  if(nav.watched[key] && loadRoutes().some(x=>x.id===nav.watched[key])){ openRouteView(nav.watched[key]); return; }
  const id=uid(), routes=loadRoutes();
  routes.push({id, name:`To ${nav.to.label}`.slice(0,40), cams:r.cams.map(c=>{
    const f=dataCache[c.k].features[c.i], p=readProps(f), d=p.directions[0]||{};
    return {k:c.k, name:p.name, coords:f.geometry.coordinates.slice(), snapshot:d.snapshot||null, video:d.video||null, camId:d.camId||null}; })});
  saveRoutes(routes); renderRouteList(); nav.watched[key]=id; openRouteView(id);
}
// traffic colours on the roads: TomTom's relative flow tiles, under the basemap's labels
function setTraffic(on){
  if(on && !map.getSource('traffic')){
    const firstSymbol=(map.getStyle().layers.find(l=>l.type==='symbol')||{}).id;
    map.addSource('traffic',{type:'raster',tiles:[NAV_BASE+'/traffic/{z}/{x}/{y}.png'],tileSize:256,attribution:'Traffic &copy; TomTom'});
    map.addLayer({id:'traffic',type:'raster',source:'traffic',paint:{'raster-opacity':0.85}}, firstSymbol);
  }
  if(map.getLayer('traffic')) map.setLayoutProperty('traffic','visibility',on?'visible':'none');
  document.getElementById('trafficOn').checked=on;
}

/* ---------- routes ---------- */
function renderRouteList(){
  const routes=loadRoutes(), el=document.getElementById('routeList');
  if(!routes.length){ el.innerHTML=`<div class="route-empty">No routes yet. Make one for your commute.</div>`; return; }
  el.innerHTML=routes.map(r=>`<div class="route-item" data-id="${r.id}"><span class="rn">${r.name}</span><span class="rc">${r.cams.length}</span><span class="rx" title="Delete">&times;</span></div>`).join('');
  el.querySelectorAll('.route-item').forEach(it=>{
    const id=it.dataset.id;
    it.querySelector('.rn').addEventListener('click',()=>openRouteView(id));
    // two taps to delete, armed state shows in place — no blocking browser dialog
    it.querySelector('.rx').addEventListener('click',(e)=>{
      const x=e.currentTarget;
      if(x.dataset.arm){ saveRoutes(loadRoutes().filter(r=>r.id!==id)); renderRouteList(); if(store.openRoute===id) closeRouteView(); return; }
      x.dataset.arm='1'; x.textContent='Delete?'; x.classList.add('arm');
      setTimeout(()=>{ if(x.isConnected){ delete x.dataset.arm; x.textContent='×'; x.classList.remove('arm'); } },2600);
    });
  });
}
function startAddMode(id, returnTo){ switchMode('add-to-route',{routeId:id, returnTo}); }
// Done lands you on what you just built: back to the route view when adding started
// there (or from route creation), back to browse otherwise. No re-finding the route.
function stopAddMode(){
  if(store.mode!=='add-to-route') return;
  const rid=modeCtx&&modeCtx.routeId, back=modeCtx&&modeCtx.returnTo==='route-view'&&rid;
  clearSelection();
  if(back) switchMode('route-view',{routeId:rid}); else switchMode('browse');
}
function sameCoords(a,b){ return Math.abs(a[0]-b[0])<1e-6 && Math.abs(a[1]-b[1])<1e-6; }
function routeHas(routeId, coords){ const r=loadRoutes().find(x=>x.id===routeId); return !!(r&&coords&&r.cams.some(c=>sameCoords(c.coords,coords))); }
function removeCameraFromRoute(routeId, coords){
  const routes=loadRoutes(), r=routes.find(x=>x.id===routeId); if(!r||!coords) return false;
  const i=r.cams.findIndex(c=>sameCoords(c.coords,coords)); if(i<0) return false;
  r.cams.splice(i,1); saveRoutes(routes); renderRouteList();
  if(routeId===store.addingTo) renderAddBanner();
  return true;
}
function addCameraToRoute(k, props, coords, routeId){
  if(!coords) return false;
  const id=routeId||store.addingTo;
  const routes=loadRoutes(), r=routes.find(x=>x.id===id); if(!r) return false;
  if(r.cams.some(c=>sameCoords(c.coords,coords))) return 'dup';
  const d=(props.directions&&props.directions[0])||{};
  // camId is what NYC route tiles rebuild their image URL from, so it must be saved at add time
  r.cams.push({k, name:props.name, coords, snapshot:d.snapshot||null, video:d.video||null, camId:d.camId||null});
  saveRoutes(routes); renderRouteList();
  if(id===store.addingTo) renderAddBanner();
  return true;
}
/* "+ Route" in a popup works on its own, the way Save works in Google Maps: pick an
   existing route or make a new one right there. The old behavior silently did nothing
   unless you had first started add-mode from the routes panel. */
function toggleRoutePicker(el, k, props, coords){
  const old=el.querySelector('.rp-menu'); if(old){ old.remove(); return; }
  const routes=loadRoutes();
  const menu=document.createElement('div'); menu.className='rp-menu';
  menu.innerHTML=`<div class="rp-hd">Save to</div>`
    + routes.map(r=>`<button class="mini-btn rp-item" data-rid="${r.id}">${r.name}</button>`).join('')
    + `<button class="mini-btn grey rp-item" data-rid="__new">+ New route</button>`;
  el.querySelector('.popup-body').appendChild(menu);
  const finish=(rid)=>{
    const res=addCameraToRoute(k, props, coords, rid);
    const r=loadRoutes().find(x=>x.id===rid);
    menu.remove();
    const btn=el.querySelector('[data-add]');
    if(btn && r){ btn.textContent = res==='dup' ? `Already in ${r.name}` : `Saved to ${r.name} ✓`;
      setTimeout(()=>{ if(btn.isConnected) btn.textContent='+ Route'; },1800); }
  };
  menu.addEventListener('click',(e)=>{
    const b=e.target.closest('.rp-item'); if(!b) return;

    menu.innerHTML=`<div class="rp-hd">Name the new route</div>
      <input class="rp-input" type="text" placeholder="e.g. Work commute" maxlength="40" autocomplete="off">
      <button class="mini-btn rp-go">Create &amp; save</button>`;
    const inp=menu.querySelector('.rp-input');
    const go=()=>{ const name=inp.value.trim(); if(!name){ inp.focus(); return; }
      const rs=loadRoutes(), nid=uid(); rs.push({id:nid,name,cams:[]}); saveRoutes(rs); renderRouteList();
      finish(nid); };
    menu.querySelector('.rp-go').addEventListener('click',go);
    inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); go(); } if(ev.key==='Escape') menu.remove(); });

let rvIO=null, rvTimer=null, rvRenderedFor=null;   // owned by route-view mode: installed on enter, removed on exit
