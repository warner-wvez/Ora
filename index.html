const srcId=(k)=>`src-${k}`;

/* ---------- routes storage ---------- */
function loadRoutes(){ try{ return JSON.parse(localStorage.getItem('ora-routes')||'[]'); }catch(e){ return []; } }
function saveRoutes(r){ localStorage.setItem('ora-routes', JSON.stringify(r)); }
function uid(){ return 'r'+Math.random().toString(36).slice(2,9); }
/* one clipboard path for everything that copies: the async API where the page is a secure
   context, a hidden textarea where it is not (opening the file straight off disk), so a copy
   never silently does nothing */
async function copyText(s){
  try{ await navigator.clipboard.writeText(s); return true; }catch(e){}
  try{
    const ta=document.createElement('textarea'); ta.value=s;
    ta.style.cssText='position:fixed;top:-1000px;opacity:0'; document.body.appendChild(ta);
    ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

/* ---------- modes (the iD pattern) ----------
   Each mode's enter() installs everything it needs — listeners, timers, UI — and its
   exit() removes all of it. Every transition goes through switchMode(), which always
   exits the old mode before entering the new one, so exactly one mode is active and
   nothing can orphan a timer or a listener by construction.
   Camera selection (the popup/sheet) is deliberately NOT a mode: browse and
   add-to-route both allow it, and it is torn down through its own single owner. */
let modeCtx=null;
const MODES={
  'browse': { enter(){}, exit(){} },
  'add-to-route': {
    enter(ctx){ store.addingTo=ctx.routeId; renderAddBanner(); clearSelection(); },
    exit(){ store.addingTo=null; document.getElementById('addBanner').classList.remove('show'); }
  },
  'route-view': {
    enter(ctx){ store.openRoute=ctx.routeId; renderRouteView(ctx); },
    exit(){ store.openRoute=null; teardownRouteView(); }
  },
  'media-enlarged': {
    enter(ctx){ buildEnlarge(ctx); },
    exit(){ teardownEnlarge(); }
  }
};
function switchMode(name, ctx){
  if(!MODES[name]) return;
  MODES[store.mode].exit();
  store.mode=name; modeCtx=ctx||{};
  MODES[name].enter(modeCtx);
}
function renderAddBanner(){
  const r=loadRoutes().find(x=>x.id===store.addingTo); if(!r) return;
  document.getElementById('addBannerTxt').textContent = r.cams.length
    ? `Added ${r.cams.length} — keep tapping “${r.name}”` : `Tap cameras to add to “${r.name}”`;
  document.getElementById('addBanner').classList.add('show');
}

/* ---------- selection containers: floating popup on desktop, bottom sheet on mobile ---------- */
const mqMobile = window.matchMedia('(max-width: 640px)');
function isMobile(){ return mqMobile.matches; }
const mqReduce = window.matchMedia('(prefers-reduced-motion: reduce)');
function reducedMotion(){ return mqReduce.matches; }

/* ---------- archive with undo (TypeUI: slot closes 200ms; Undo drains 4s linear, pauses on hover or focus) ---------- */
const EASE_EXPO='cubic-bezier(.16,1,.3,1)';
function closeSlot(el,done){
  if(el._slot) el._slot.cancel();
  if(reducedMotion()){ done(); return; }
  const h=el.getBoundingClientRect().height, gap=parseFloat(getComputedStyle(el.parentElement).rowGap)||0;
  el.style.overflow='hidden';
  el._slot=el.animate([{height:h+'px',opacity:1,transform:'none',marginBottom:'0px'},
                       {height:'0px',opacity:0,transform:'translateX(20px)',marginBottom:(-gap)+'px'}],{duration:200,easing:EASE_EXPO,fill:'forwards'});
  el._slot.onfinish=()=>{ el._slot=null; done(); };
}
function openSlot(el){
  el.getAnimations().forEach(a=>a.cancel()); el._slot=null;     // drops the held closed frame
  el.style.overflow='';
  if(reducedMotion()) return;
  const h=el.getBoundingClientRect().height;
  el.style.overflow='hidden';
  el.animate([{height:'0px',opacity:0,transform:'translateX(20px)'},{height:h+'px',opacity:1,transform:'none'}],{duration:220,easing:EASE_EXPO})
    .onfinish=()=>{ el.style.overflow=''; };
}
let undoState=null;
function hideUndo(){
  const t=document.getElementById('undoToast'); if(t) t.classList.remove('show');
  if(undoState){ undoState.drain.cancel(); undoState=null; }
}
function showUndo(msg,onUndo){
  let t=document.getElementById('undoToast');
  if(!t){
    t=document.createElement('div'); t.id='undoToast'; t.className='undo-toast'; t.setAttribute('role','status');
    t.innerHTML='<span class="ut-msg"></span><button type="button">Undo</button><span class="drain" aria-hidden="true"></span>';
    document.body.appendChild(t);
    const pause=()=>{ if(undoState) undoState.drain.pause(); }, play=()=>{ if(undoState) undoState.drain.play(); };
    t.addEventListener('mouseenter',pause); t.addEventListener('mouseleave',play);
    t.addEventListener('focusin',pause); t.addEventListener('focusout',e=>{ if(!t.contains(e.relatedTarget)) play(); });
    t.querySelector('button').addEventListener('click',()=>{ const st=undoState; hideUndo(); if(st) st.onUndo(); });
  }
  if(undoState) undoState.drain.cancel();      // a newer removal replaces the older Undo; the older one is final
  t.querySelector('.ut-msg').textContent=msg;
  const drain=t.querySelector('.drain').animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],{duration:4000,easing:'linear',fill:'forwards'});
  undoState={drain,onUndo};
  drain.onfinish=()=>{ if(undoState && undoState.drain===drain) hideUndo(); };
  requestAnimationFrame(()=>t.classList.add('show'));
}
// a selection survives only while its token matches; every new selection bumps it,
// which is the same race guard the popup already used, generalized to both containers
function selectionAlive(token){ return !!(store.selected && store.selected.token===token); }
function selContainer(){
  if(popup) return popup.getElement()||null;
  const s=document.getElementById('sheet');
  return s.classList.contains('open') ? document.getElementById('sheetContent') : null;
}
/* one teardown path for whatever holds the selected camera: media first, then both
   containers, then the store. Everything that closes a selection routes through here. */
function clearSelection(){
  destroyPopupHls(); closeEnlarge();
  if(popup){ const p=popup; popup=null; p.remove(); }
  closeSheet();
  store.selected=null;
  document.body.classList.remove('rv-aside');          // a phone's route view comes back when its camera closes
}

/* ---------- bottom sheet ---------- */
let sheetDetent='peek';
function sheetPeekOffset(){
  const s=document.getElementById('sheet'), c=document.getElementById('sheetContent');
  if(c.querySelector('.place-card')) return 0;          // a place card is short; show all of it, Directions included
  const media=c.querySelector('.popup-imgwrap'), head=c.querySelector('.popup-body h3, .enf h3');
  // peek shows the grip, the picture and the title line; the rest waits below the fold
  const visible=36 + (media?media.offsetHeight:0) + (head?head.offsetHeight+64:120);
  return Math.max(0, s.offsetHeight - Math.min(visible, s.offsetHeight));
}
function setSheetDetent(d){
  sheetDetent=d;
  const s=document.getElementById('sheet'), off=sheetPeekOffset();
  s.style.transform = d==='expanded' ? 'translateY(0)' : `translateY(${off}px)`;
  syncGrip(s.querySelector('.sheet-grip'), d==='expanded', off>0, 'card');
}
// a grip only speaks to screen readers and the Tab key when tapping it would change something
function syncGrip(g, expanded, useful, what){
  if(!g) return;
  g.setAttribute('aria-label', `${expanded?'Collapse':'Expand'} ${what}`);
  g.tabIndex=useful ? 0 : -1;
  if(useful) g.removeAttribute('aria-hidden'); else g.setAttribute('aria-hidden','true');
}
function openSheet(html){
  const s=document.getElementById('sheet');
  document.getElementById('sheetContent').innerHTML=html;
  const wasOpen=s.classList.contains('open');
  if(!wasOpen){ s.style.display='flex'; void s.offsetHeight; s.classList.add('open'); }  // reflow so the slide-up animates
  requestAnimationFrame(()=>setSheetDetent(wasOpen?sheetDetent:'peek'));
}
function closeSheet(){
  const s=document.getElementById('sheet');
  if(!s.classList.contains('open')) return;
  s.classList.remove('open'); s.style.transform='';   // base translateY(100%) slides it out
  setTimeout(()=>{ if(!s.classList.contains('open')){ s.style.display='none'; document.getElementById('sheetContent').innerHTML=''; } },280);
}
function wireSheet(){
  const s=document.getElementById('sheet'), grip=s.querySelector('.sheet-grip');
  document.getElementById('sheetClose').addEventListener('click',clearSelection);
  let startY=0, startT=0, curT=0, t0=0, dragging=false, moved=false, dragged=false;
  const getT=()=>{ const m=/translateY\(([-\d.]+)px\)/.exec(s.style.transform); return m?parseFloat(m[1]):0; };
  grip.addEventListener('pointerdown',(e)=>{ dragging=true; moved=false; dragged=false; startY=e.clientY; startT=getT(); curT=startT; t0=performance.now();
    s.classList.add('dragging'); grip.setPointerCapture(e.pointerId); });
  grip.addEventListener('pointermove',(e)=>{ if(!dragging) return;
    if(Math.abs(e.clientY-startY)>6) moved=true;
    curT=Math.max(0, startT+(e.clientY-startY)); s.style.transform=`translateY(${curT}px)`; });
  // a tap (or Enter/Space) switches peek and expanded; a drag already settled the sheet, so
  // the click that follows it is ignored
  grip.addEventListener('click',()=>{ if(dragged){ dragged=false; return; } setSheetDetent(sheetDetent==='expanded'?'peek':'expanded'); });
  const settle=(e)=>{
    if(!dragging) return; dragging=false; s.classList.remove('dragging');
    if(!moved){ setSheetDetent(sheetDetent); return; }            // a tap: the click handler decides
    dragged=true;
    const v=(e.clientY-startY)/Math.max(1,performance.now()-t0);          // px per ms, + is downward
    const peekY=sheetPeekOffset(), h=s.offsetHeight;
    let d;
    if(v>0.4) d = curT>peekY+18 ? 'dismiss' : 'peek';                     // a flick follows the finger
    else if(v<-0.4) d = 'expanded';
    else { const opts=[{y:0,d:'expanded'},{y:peekY,d:'peek'},{y:h,d:'dismiss'}];  // otherwise snap to nearest
      d=opts.reduce((a,b)=>Math.abs(curT-b.y)<Math.abs(curT-a.y)?b:a).d; }
    if(d==='dismiss') clearSelection(); else setSheetDetent(d);
  };
  grip.addEventListener('pointerup',settle);
  grip.addEventListener('pointercancel',()=>{ if(dragging){ dragging=false; s.classList.remove('dragging'); setSheetDetent(sheetDetent); } });
}
// the phone route sheet: tap the grip (or swipe it up/down) to switch between its usual height
// and all the room under the trip card
function setDsTall(on){
  const s=document.getElementById('dirSheet'); s.classList.toggle('tall', on); syncDsGrip();
}
function syncDsGrip(){
  const s=document.getElementById('dirSheet'), b=s.querySelector('.ds-body'), tall=s.classList.contains('tall');
  syncGrip(s.querySelector('.ds-grip'), tall, tall || b.scrollHeight>b.clientHeight+2, 'route list');
}
function wireDirSheet(){
  const s=document.getElementById('dirSheet'), grip=s.querySelector('.ds-grip'), panel=document.getElementById('panel');
  // the route sheet never covers the trip card above it. The card animates its height on a
  // phone, so a one-off measure caught it halfway; watch its size instead.
  new ResizeObserver(()=>{ document.documentElement.style.setProperty('--panelB', Math.round(panel.getBoundingClientRect().bottom)+'px');
    if(s.classList.contains('open')) syncDsGrip(); }).observe(panel);
  let y0=null, swiped=false;
  grip.addEventListener('pointerdown',(e)=>{ y0=e.clientY; swiped=false; grip.setPointerCapture(e.pointerId); });
  grip.addEventListener('pointerup',(e)=>{ if(y0==null) return; const dy=e.clientY-y0; y0=null;
    if(Math.abs(dy)>24){ swiped=true; setDsTall(dy<0); } });
  grip.addEventListener('pointercancel',()=>{ y0=null; });
  grip.addEventListener('click',()=>{ if(swiped){ swiped=false; return; } setDsTall(!s.classList.contains('tall')); });
}

/* ---------- live popup (snapshot or HLS video) ---------- */
// one media owner, one teardown path: clears the snapshot interval, the liveness/watch
// timers and the HLS instance. Everything that starts media must route its timer here.
function destroyPopupHls(){ if(popupTimer){ clearInterval(popupTimer); popupTimer=null; } if(popupWatch){ clearTimeout(popupWatch); popupWatch=null; } if(popupLive){ clearTimeout(popupLive); popupLive=null; } if(popupUnwatch){ try{popupUnwatch();}catch(e){} popupUnwatch=null; } if(popupHls){ try{popupHls.destroy();}catch(e){} popupHls=null; } }
// video only plays where the state's stream host allows cross-origin playback; that
// fact lives in the view's status ('live'), computed once in applyStatus
function canPlayVideo(dir, cfg){
  const live = dir.status ? dir.status==='live' : !!(dir.video && cfg && cfg.hasVideo);
  return !!(live && window.Hls && Hls.isSupported());
}
// whether a view has a still image is the layer's call (NYC builds its URL from camId
// at render time and stores snapshot:null), so ask cfg.snap, never the raw field
function snapSrc(dir, cfg){ return (dir && cfg && cfg.snap) ? (cfg.snap(dir)||'') : ''; }

/* ---------- delivered resolution ----------
   A camera below 640px wide is blind to a detector and no model fixes it, so it is the one
   hard filter on this map — and the browser already knows the true pixel size of whatever it
   just decoded, for free, the moment the media loads. Read it off, show it, remember it:
   browsing the map IS the resolution census, collected passively instead of swept for.
   The video outranks the poster snapshot when both land, because the stream is what a
   detector would actually see.

   THE CHIP ONLY EVER SHOWS WHAT THE BROWSER JUST DECODED. Do not paint it from resCache to
   save a second on a re-visit: a camera that measured 1280x720 last week may be dead today,
   and a remembered number rendered as a live readout is the map stating a present-tense fact
   it has not confirmed — the same lie as the "NOT LIVE" badge above. Remembered numbers
   belong in the route tiles and the export, where being a record is the whole point. */
const RES_MIN_W=640, RES_SNAP=1, RES_VIDEO=2;          // rank: a truer source never loses to a weaker one
// a view's identity in the cache: the stream if there is one, else the canonical snapshot
// (the same normalizer the health sweep keys on), else NYC's camera id. A saved route entry
// carries those same three fields, so one key function serves both.
const resKey=(d)=> !d ? '' : (d.video || (d.snapshot ? snapKey(d.snapshot) : (d.camId ? 'nyc:'+d.camId : '')));
let resCache=(()=>{ try{ return JSON.parse(localStorage.getItem('ora-res')||'{}'); }catch(e){ return {}; } })();
let resSaveT=null;
function rememberRes(key, w, h, rank){
  const prev=resCache[key];
  if(!key || (prev && prev.rank>rank)) return;
  const s=store.selected;
  resCache[key]={w, h, rank, name:(s&&s.props&&s.props.name)||(prev&&prev.name)||null};
  clearTimeout(resSaveT);                              // debounced: a snapshot reloads every refresh
  resSaveT=setTimeout(()=>{ try{ localStorage.setItem('ora-res', JSON.stringify(resCache)); }catch(e){} }, 500);
}
function paintRes(host, w, h, rank){
  const c=host&&host.querySelector('[data-res]');
  if(!c || !w || !h || +(c.dataset.rank||0)>rank) return;
  c.dataset.rank=rank; c.textContent=`${w}×${h}`;
  c.classList.toggle('low', w<RES_MIN_W);
  c.title = w<RES_MIN_W ? `${w}px wide — under the ${RES_MIN_W}px a vehicle detector needs`
                        : `${w}px wide — clears the ${RES_MIN_W}px bar`;
  c.hidden=false;
}
function resetRes(host){ const c=host&&host.querySelector('[data-res]'); if(c){ c.hidden=true; c.dataset.rank=0; } }
// an HLS stream's intrinsic size changes when hls.js switches variant, so watch 'resize' as
// well as the first metadata: the number on screen must be what is decoding right now
function watchRes(el, host, rank, key){
  if(!el || !host) return;
  const isVid=el.tagName==='VIDEO';
  const read=()=>{
    const w=isVid?el.videoWidth:el.naturalWidth, h=isVid?el.videoHeight:el.naturalHeight;
    if(!w || !h) return;
    paintRes(host, w, h, rank); rememberRes(key, w, h, rank);
  };
  if(isVid){ el.addEventListener('loadedmetadata', read); el.addEventListener('resize', read); if(el.videoWidth) read(); }
  else { el.addEventListener('load', read); if(el.complete && el.naturalWidth) read(); }
}

function mediaHTML(dir, cfg){
  const live = canPlayVideo(dir, cfg), src = snapSrc(dir, cfg);
  // video cameras show the snapshot instantly as a poster, then the live video fades in over it
  // Texas streams have no snapshot at all, so the video fades in over a dark backdrop instead
  if(live) return `<div class="popup-imgwrap${src?'':' noposter'}"><span class="live-badge">● LIVE</span>
    ${src?`<img class="poster" src="${src}" onload="frameOk(this);this.parentElement.classList.add('loaded')" onerror="imgFail(this)">`:''}
    <video id="popup-vid" class="vid" muted autoplay playsinline></video>
    <div class="img-offline">&#9888;<span class="off-cam">Camera offline</span><span class="off-net">No connection</span></div>
    <button class="enlarge-btn" title="Enlarge" data-enlarge>&#10530;</button></div>`;
  // no still to fall back on: either a video-only camera this browser cannot play, or a
  // location-only pin (camera exists, no feed published) — say which, do not imply it is broken
  if(!src) return `<div class="popup-imgwrap err noposter"><div class="img-offline">&#9888;<span>${dir.video?'Live video unsupported here':'No live image at this camera'}</span></div></div>`;
  return `<div class="popup-imgwrap"><img id="popup-img" src="${src}" onload="imgLoad(this)" onerror="imgFail(this)"><div class="img-offline">&#9888;<span class="off-cam">Camera offline</span><span class="off-net">No connection</span></div>
    <button class="enlarge-btn" title="Enlarge" data-enlarge>&#10530;</button></div>`;
}
// WSDOT is the only source that publishes which way a camera looks, and the only one
// whose image timestamps let us measure how often it actually changes. Both belong to
// a single view rather than the location: one ferry terminal aims three cameras at
// one holding lane, each pointing a different way.
const FACING_ARROW={'Northbound':'↑','Southbound':'↓','Eastbound':'→','Westbound':'←','Both directions':'↕'};
/* probe-health.py checks every snapshot on a schedule. A camera can report itself
   healthy and still serve a "camera unavailable" card: Hawaii says status OK on all
   52 of them. These three verdicts come from what the image actually was. */
const HEALTH_TEXT={offline:'image not loading', placeholder:'reported offline', frozen:'image frozen 24h+'};
function ago(iso){
  if(!iso) return 'recently';
  const h=(Date.now()-new Date(iso).getTime())/3.6e6;
  if(h<1.5) return 'just now';
  return h<48 ? `${Math.round(h)}h ago` : `${Math.round(h/24)}d ago`;
}
// health describes the snapshot. Where a live stream is what you actually watch,
// the runtime liveness check is the authority, so do not contradict it here.
// (applyStatus already encodes that outranking: a playable view is status 'live'.)
function shownHealth(dir, cfg){ return (dir.status==='offline'||dir.status==='frozen') ? dir.health : null; }
function camAge(dir, cfg){
  const h=shownHealth(dir,cfg);
  if(h) return `${HEALTH_TEXT[h]||'not live'} · checked ${ago(cfg.healthAt)}`;
  if(dir.stale_since) return `no new image since ${new Date(dir.stale_since).toLocaleDateString(undefined,{month:'short',year:'numeric'})}`;
  if(!dir.refresh_sec) return cfg.age||'snapshot';
  return dir.refresh_sec<90 ? 'new image about every minute'
                            : `new image about every ${Math.round(dir.refresh_sec/60)} min`;
}
// polling faster than the source updates just burns requests on an identical JPEG
function refreshMsFor(dir, cfg){
  if(dir.stale_since) return 300000;          // frozen years ago; it will not change now
  if(!dir.refresh_sec) return cfg.refreshMs||30000;
  return Math.min(300000, Math.max(15000, dir.refresh_sec*1000));
}
function facingHTML(dir){
  return dir.facing ? `<div class="popup-facing"><span class="arrow">${FACING_ARROW[dir.facing]||'•'}</span>${dir.facing}</div>` : '';
}
// a source's placeholder ("NONE", blank) is not a name; those fall back to View 1, View 2
function dirLabel(d,i){
  const v=[d.label,d.facing,d.direction].find(x=>x&&String(x).trim()&&!/^none$/i.test(String(x).trim()));
  return v||('View '+(i+1));
}
function buildLivePopup(props, cfg){
  const dirs=props.directions, showDir=dirs.length>1;
  return `<div class="popup-inner">${mediaHTML(dirs[0],cfg)}
      <div class="popup-body"><h3>${props.name}<span class="res-chip" data-res hidden></span></h3>
        ${props.rwis?`<div class="popup-rwis">${props.rwis}</div>`:''}
        ${showDir?`<div class="popup-dirs">${dirs.map((d,i)=>`<button class="dir-btn ${i===0?'active':''}" data-idx="${i}">${dirLabel(d,i)}</button>`).join('')}</div>`:''}
        <div class="popup-meta">${facingHTML(dirs[0])}</div>
        <div class="popup-foot"><span class="popup-age${(dirs[0].stale_since||shownHealth(dirs[0],cfg))?' stale':''}">${camAge(dirs[0],cfg)}</span>
          <button class="popup-add" data-add>+ Route</button></div>
        <div class="popup-who">${whoLine()}</div>
        <div class="cam-nav" hidden><button class="cam-arrow" data-cyc="-1" title="Previous camera (←)">&#8249;</button><span class="cam-pos"></span><button class="cam-arrow" data-cyc="1" title="Next camera (→)">&#8250;</button></div>
      </div></div>`;
}
/* A stream can attach, buffer and still show you nothing: the clock runs while the
   picture is a frozen frame or a "camera unavailable" card baked into the encoder.
   hls.js feeds the video through MSE from a blob: URL, which is same-origin, so
   unlike a cross-origin <img> the canvas is not tainted and we can read the pixels.
   Sample the picture twice; if it never changes, stop calling it live. */
// the badge stops claiming a stream is live the moment we can tell it is not.
// the poster snapshot stays visible if there is one, because a recent still beats nothing.
function markNotLive(wrap){
  if(!wrap.isConnected) return;   // bail if this selection's media was already replaced
  wrap.classList.add('notlive'); wrap.classList.remove('ready');
  const b=wrap.querySelector('.live-badge'); if(b) b.textContent='● NOT LIVE';
  if(!wrap.querySelector('.poster')) wrap.classList.add('err');
}
function watchLiveness(vid, wrap){
  const cv=document.createElement('canvas'); cv.width=48; cv.height=36;
  const cx=cv.getContext('2d',{willReadFrequently:true});
  const frame=()=>{ try{ cx.drawImage(vid,0,0,48,36); return cx.getImageData(0,0,48,36).data; }catch(e){ return null; } };
  const delta=(a,b)=>{ let s=0; for(let i=0;i<a.length;i+=4) s+=Math.abs(a[i]-b[i]); return s/(a.length/4); };
  let f0=null, t0=0, still=0;
  const tick=()=>{
    if(!vid.isConnected) return;
    // a video WE paused says nothing about the camera. buildEnlarge pauses this one on
    // purpose so two copies of the stream are not decoding at once, and a paused video has a
    // frozen clock and pixel-identical frames — both of the things below read as a dead
    // stream. Judging it meant that enlarging a camera to look at it marked it dead behind
    // you, which is exactly the click a curator makes. Re-seed and wait for playback.
    if(vid.paused){ f0=null; still=0; popupLive=setTimeout(tick,3500); return; }
    const f=frame();
    if(!f) return;                                     // pixels unreadable; say nothing
    if(f0){
      if(vid.currentTime-t0 <= 0.3){ markNotLive(wrap); return; }   // the clock stopped
      // A live camera pointed at a quiet road is ALMOST still, and at delta<0.02 over two
      // samples this called it dead after 7 seconds without traffic — the map lying about a
      // working camera. A synthetic frozen frame repeats near-exactly (delta ≈ 0), so a tight
      // threshold still catches it; holding out for 5 samples (~18s) gives a real road time
      // for one car to cross it.
      still = delta(f0,f) < 0.004 ? still+1 : 0;
      if(still>=5){ markNotLive(wrap); return; }        // 5 consecutive near-identical samples
    }
    f0=f; t0=vid.currentTime;
    popupLive=setTimeout(tick,3500);
  };
  popupLive=setTimeout(tick,3500);
}
function playDir(dir, cfg, el, token){
  if(!selectionAlive(token)) return;
  destroyPopupHls();
  const wrap=el.querySelector('.popup-imgwrap');
  const live=canPlayVideo(dir, cfg);
  // resolution belongs to the VIEW, not the camera, so it resets every time the view changes.
  // Both media elements are watched: the video is the truth where there is one, and where the
  // stream never attaches the snapshot is what this camera actually delivers.
  resetRes(el);
  watchRes(el.querySelector('.poster, #popup-img'), el, RES_SNAP, resKey(dir));
  if(live){
    const vid=el.querySelector('#popup-vid');
    watchRes(vid, el, RES_VIDEO, resKey(dir));
    const signed=cfg.sign==='tx';
    popupHls=new Hls({maxBufferLength:8, startFragPrefetch:true, maxMaxBufferLength:20, ...(signed?txConfig():{})});
    const mine=popupHls;                                  // the signing hop below can outlive this selection
    popupHls.attachMedia(vid);
    popupHls.on(Hls.Events.FRAG_LOADED,()=>{ if(popupWatch){ clearTimeout(popupWatch); popupWatch=null; }
      if(!wrap.classList.contains('ready')){ wrap.classList.add('ready'); watchLiveness(vid,wrap); } }); // video fades in over the poster
    // keep the poster snapshot on failure, but stop the badge insisting it is live. A signed state
    // rides out its token gap first, so a five-minute-old Texas stream is not called dead.
    if(signed) popupUnwatch=txWatch(popupHls, ()=>{ destroyPopupHls(); markNotLive(wrap); });
    else popupHls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal){ destroyPopupHls(); markNotLive(wrap); } });
    // signing is a network hop for Texas and immediate everywhere else; either way the stall
    // watchdog starts once there is a source to watch, so a slow sign is not read as a dead camera
    const stale=()=>!selectionAlive(token) || popupHls!==mine;
    resolveVideo(cfg, dir).then(src=>{
      if(stale()) return;
      if(!src){ destroyPopupHls(); markNotLive(wrap); return; }
      mine.loadSource(src);
      // a dead SkyVDN stream stalls without hls.js ever reporting a fatal error. Roughly 5% of
      // streams are down, and behind a poster that reads as a live camera that has simply stopped
      // moving, which is the whole complaint. Watch every video camera, poster or not.
      popupWatch=setTimeout(()=>{ if(!wrap.classList.contains('ready')){ destroyPopupHls(); markNotLive(wrap); } }, 12000);
    }).catch(()=>{ if(!stale()){ destroyPopupHls(); markNotLive(wrap); } });
  } else {
    const img=el.querySelector('#popup-img'); if(img) img.src=cfg.snap(dir);
  }
}
// wires the selected camera's UI inside whatever container holds it: the desktop
// popup's element or the sheet's fresh .popup-inner node. The token is the race
// guard: any wiring, timer tick or render belonging to a replaced selection no-ops.
function wireCameraUI(el, props, cfg, token){
  if(!el || !selectionAlive(token)) return;             // this wiring belongs to exactly one selection
  let idx=0;
  // snapshot refresh runs through the single global popupTimer that destroyPopupHls owns
  const snapLoop=(dir)=>{ if(canPlayVideo(dir,cfg)) return;
    popupTimer=setInterval(()=>{ if(!selectionAlive(token) || netOff) return; const im=el.querySelector('#popup-img'); if(im) im.src=cfg.snap(dir); }, refreshMsFor(dir,cfg)); };
  const render=()=>{ // rebuild media element for current dir
    if(!selectionAlive(token)) return;                  // a newer tap owns the selection now
    const dir=props.directions[idx];
    destroyPopupHls();                                  // tear media down before its element is swapped out
    const wrap=el.querySelector('.popup-imgwrap');
    wrap.outerHTML=mediaHTML(dir,cfg);
    playDir(dir,cfg,el,token);
    // facing and refresh belong to the view, so they change with it
    el.querySelector('.popup-meta').innerHTML=facingHTML(dir);
    const age=el.querySelector('.popup-age');
    age.textContent=camAge(dir,cfg); age.classList.toggle('stale',!!(dir.stale_since||shownHealth(dir,cfg)));
    snapLoop(dir);
  };
  playDir(props.directions[0],cfg,el,token);
  snapLoop(props.directions[0]);
  // back online: a still swaps in its newest frame, a video starts over
  camRefresh.set('popup', ()=>{ if(!selectionAlive(token)) return; const dir=props.directions[idx], im=el.querySelector('#popup-img');
    if(im && !canPlayVideo(dir,cfg)) im.src=cfg.snap(dir); else render(); });
  el.querySelectorAll('.dir-btn').forEach(btn=>btn.addEventListener('click',()=>{
    idx=parseInt(btn.dataset.idx,10);
    el.querySelectorAll('.dir-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
    render();
  }));
  const addBtn=el.querySelector('[data-add]');
  const selK=store.selected?store.selected.k:null, selCoords=store.selected?store.selected.coords.slice():null;
  // in add-mode the button reads as this camera's state in that route, and one tap
  // toggles it — the undo lives exactly where the mistake happened
  const updateAddBtn=()=>{
    if(!addBtn) return;
    if(!store.addingTo){ addBtn.textContent='+ Route'; return; }
    const r=loadRoutes().find(x=>x.id===store.addingTo); if(!r) return;
    addBtn.textContent = routeHas(store.addingTo, selCoords) ? `In “${r.name}” · remove` : `+ Add to “${r.name}”`;
  };
  updateAddBtn();
  if(addBtn) addBtn.addEventListener('click',()=>{
    if(store.addingTo){
      if(routeHas(store.addingTo, selCoords)) removeCameraFromRoute(store.addingTo, selCoords);
      else addCameraToRoute(selK, props, selCoords);
      updateAddBtn(); return;
    }
    toggleRoutePicker(el, selK, props, selCoords);
  });
  // click the picture (or its expand button) to open the same view full-screen
  el.addEventListener('click',(e)=>{
    if(e.target.closest('.dir-btn')||e.target.closest('[data-add]')||e.target.closest('[data-cyc]')) return;
    if(e.target.closest('[data-enlarge]')||e.target.closest('.popup-imgwrap')) openEnlarge(props.directions[idx], cfg, props);
  });
  // arrow-cycle pager: step through the state's spatial order. Shown only when this selection
  // sits in the feed (a saved-route cam opened off-feed has no index and cannot be stepped).
  const nav=el.querySelector('.cam-nav'), s0=store.selected;
  if(nav){
    const ord=(s0 && s0.i!=null && s0.i>=0) ? spatialOrder(cycleGroupKey(s0.k)) : null;
    const cur0=ord ? orderPos(ord,s0.k,s0.i) : null;
    if(ord && cur0!=null){ const total=ord.total, posEl=el.querySelector('.cam-pos');
      posEl.textContent=`${cur0+1} / ${total}`;
      posEl.title='Double-click to jump to a camera number';
      nav.hidden=false;
      nav.querySelectorAll('[data-cyc]').forEach(b=>b.addEventListener('click',()=>cycleCamera(+b.dataset.cyc)));
      // double-click the counter to type a position (e.g. the last camera in the state)
      posEl.addEventListener('dblclick',()=>{
        const inp=document.createElement('input'); inp.className='cam-jump'; inp.type='text'; inp.inputMode='numeric';
        inp.value=String((orderPos(ord,store.selected.k,store.selected.i)??0)+1);
        posEl.replaceWith(inp); inp.focus(); inp.select();
        const cancel=()=>{ if(inp.isConnected) inp.replaceWith(posEl); };
        inp.addEventListener('keydown',ev=>{
          if(ev.key==='Enter'){ ev.preventDefault(); const v=parseInt(inp.value,10); if(v>=1) jumpToOrderPos(v); else cancel(); }
          else if(ev.key==='Escape'){ ev.preventDefault(); cancel(); } });
        inp.addEventListener('blur',cancel);
      });
    }
  }
}

/* ---------- full-screen enlarge (snapshot or HLS video), shared by every layer ---------- */
let enlargeState=null;
// Shared element expand: the popup picture grows into the big view (280ms) while the backdrop
// and controls fade in behind it, and shrinks back on close, so it reads as the same picture
let enlargeFrom=null;
const EASE_MORPH='cubic-bezier(.22,1,.36,1)';
function thumbRect(){
  const c=selContainer(), w=c && c.querySelector('.popup-imgwrap');
  const r=w && w.getBoundingClientRect();
  return r && r.width && r.bottom>0 && r.top<innerHeight ? r : null;
}
function morphMedia(ov,from,opening){
  const m=ov.querySelector('.enlarge-media'), to=m && m.getBoundingClientRect();
  if(!m || !to.width) return null;
  const dx=(from.left+from.width/2)-(to.left+to.width/2), dy=(from.top+from.height/2)-(to.top+to.height/2);
  const small={transform:`translate(${dx}px,${dy}px) scale(${from.width/to.width},${from.height/to.height})`}, big={transform:'none'};
  const opt={duration:opening?280:240,easing:EASE_MORPH,fill:'forwards'};
  ov.style.animation='none';                       // the plain overlay fade gives way to the morph

  ov.animate(opening?dim:dim.reverse(),opt);
  ov.querySelectorAll('.enlarge-nav,.enlarge-close,.enlarge-cap,.enlarge-loading').forEach(el=>
    el.animate(opening?[{opacity:0},{opacity:1}]:[{opacity:1},{opacity:0}],{duration:opening?150:100,delay:opening?100:0,easing:'ease-out',fill:'both'}));

function openEnlarge(dir, cfg, props){

  enlargeFrom=reducedMotion()?null:thumbRect();
  switchMode('media-enlarged',{dir,cfg,props,returnTo:{name:store.mode,ctx:modeCtx}});
}
function closeEnlarge(){ if(store.mode==='media-enlarged') switchMode(modeCtx.returnTo.name, {...modeCtx.returnTo.ctx, resume:true}); }
function teardownEnlarge(immediate){

  if(hls){ try{ hls.destroy(); }catch(e){} }

  // into the popup picture when it is still on screen, and fades out when it is not
  const back=!immediate && !reducedMotion() && thumbRect();

    const a=morphMedia(ov,back,false); if(a) a.onfinish=()=>ov.remove(); else ov.remove(); }

let enlargeFit='contain';
// a three-dot pulse over the black box while the feed decodes — on first open and again on
// every arrow to the next camera. Pure SVG/SMIL, so it animates with no script running.
const ENLARGE_SPINNER=`<div class="enlarge-loading"><svg class="enlarge-spinner" width="42" height="42" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <circle cx="4" cy="12" r="2" fill="currentColor"><animate id="spA" begin="0;spC.end+0.25s" attributeName="cy" calcMode="spline" dur="0.6s" values="12;6;12" keySplines=".33,.66,.66,1;.33,0,.66,.33"/></circle>
  <circle cx="12" cy="12" r="2" fill="currentColor"><animate begin="spA.begin+0.1s" attributeName="cy" calcMode="spline" dur="0.6s" values="12;6;12" keySplines=".33,.66,.66,1;.33,0,.66,.33"/></circle>
  <circle cx="20" cy="12" r="2" fill="currentColor"><animate id="spC" begin="spA.begin+0.2s" attributeName="cy" calcMode="spline" dur="0.6s" values="12;6;12" keySplines=".33,.66,.66,1;.33,0,.66,.33"/></circle>

      <button class="enlarge-close" title="Close">&#10005;</button>
