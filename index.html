// a route camera's status, from the same health sweep the map pins use. Live-video
// cams count as up: runtime playback is the authority there, the sweep judges snapshots.
function routeCamStatus(c){
  const cfg=LAYERS[c.k];
  if(c.video && cfg && cfg.hasVideo) return 'live';
  const h=healthCache[c.k];
  const s=(h && h.status && c.snapshot) ? h.status[snapKey(c.snapshot)] : null;
  return s ? (s==='frozen'?'frozen':'offline') : 'snapshot';
}
/* A route IS the curation list: tap cameras onto it, then take it with you. Everything a
   downstream pipeline needs to pull frames — where the camera is, what it streams, and the
   resolution this browser actually decoded (null where it was never opened) — in one paste. */
function routeExport(r){
  return r.cams.map(c=>{
    const m=resCache[resKey(c)]||{};
    return { state: LAYERS[c.k] ? LAYERS[c.k].name : c.k, name: c.name,
      lon: c.coords[0], lat: c.coords[1], status: routeCamStatus(c),
      width: m.w||null, height: m.h||null,
      video: c.video||null, snapshot: c.snapshot||null, camId: c.camId||null };
  });
}
// the glanceable answer to "can I trust this route right now": how many cameras,
// how many down, and how fresh that verdict is
function renderRouteHeader(r){
  document.getElementById('rvTitle').textContent=r.name;
  const n=r.cams.length;
  let sub;
  if(!n) sub='No cameras yet';
  else {
    const layers=[...new Set(r.cams.map(c=>c.k))];
    const checked=layers.map(k=>healthCache[k]&&healthCache[k].checked_at).filter(Boolean).sort().pop();
    const down=r.cams.filter(c=>['offline','frozen'].includes(routeCamStatus(c))).length;
    sub = checked ? `${n} camera${n!==1?'s':''} · ${down?`${down} down right now`:'all up'} · checked ${ago(checked)}`
                  : `${n} camera${n!==1?'s':''} · scroll your whole route`;
  }
  document.getElementById('rvSub').textContent=sub;
}
// dead cameras read as dead before the image even tries to load, and every camera already
// opened carries the resolution it delivered — so the route answers "judged? and does it
// clear 640px?" without reopening a single one
function applyRvBadges(id){
  const r=loadRoutes().find(x=>x.id===id); if(!r) return;
  [...document.getElementById('rvBody').querySelectorAll('.rv-tile')].forEach((tile,i)=>{
    const c=r.cams[i]; if(!c) return;
    const st=routeCamStatus(c);
    const media=tile.querySelector('.rv-media');
    const old=tile.querySelector('.rv-badge'); if(old) old.remove();
    if(st==='offline'||st==='frozen'){
      const b=document.createElement('span'); b.className='rv-live rv-dead rv-badge';
      b.textContent = st==='frozen' ? 'FROZEN' : 'OFFLINE';
      media.appendChild(b);
    }
    const oldRes=tile.querySelector('.rv-res'); if(oldRes) oldRes.remove();
    const m=resCache[resKey(c)];                       // a route entry keys the same way a view does
    if(m){ const e=document.createElement('span'); e.className='rv-res'+(m.w<RES_MIN_W?' low':'');
      e.textContent=`${m.w}×${m.h}`; media.appendChild(e); }
  });
}
// tap a tile and the map takes you to that camera with its popup/sheet open. If its
// state layer is off it is enabled silently: the map flies to the tapped camera only,
// never to the state, even though the checkbox path normally flies.
async function jumpToRouteCam(c){
  const k=c.k;
  if(LAYERS[k] && !store.activeLayers.has(k)) await enableLayer(k,false);
  const d=dataCache[k];
  const feat=d && d.features.find(f=>Math.abs(f.geometry.coordinates[0]-c.coords[0])<1e-6 && Math.abs(f.geometry.coordinates[1]-c.coords[1])<1e-6);
  // the tap is the request to go there; offset keeps the pin out from under the route panel
  map.easeTo({center:c.coords, zoom:Math.max(map.getZoom(),14), duration:600, offset:isMobile()?[0,0]:[-190,0]});
  if(feat) selectFeature(k,feat);
  else selectFeature(k,{geometry:{type:'Point',coordinates:c.coords.slice()},
    properties:{name:c.name, directions:[{snapshot:c.snapshot, video:c.video, camId:c.camId,
      status:(c.video&&LAYERS[k]&&LAYERS[k].hasVideo)?'live':'snapshot'}]}});  // camera no longer in the feed: show what we saved
}
function renderRouteView(ctx){
  const id=ctx.routeId;
  const r=loadRoutes().find(x=>x.id===id); if(!r) return;
  const body=document.getElementById('rvBody');
  // returning from an overlay (enlarge) re-shows the existing DOM so scroll survives;
  // only the behavior (observers, timers) is reinstalled
  const resume = ctx.resume && rvRenderedFor===id && body.children.length;
  renderRouteHeader(r);
  if(!resume){
    if(!r.cams.length){ body.innerHTML=`<div class="rv-empty">Empty route.<br>Tap “+ Add cameras” above, then tap cameras on the map.</div>`; }
    else body.innerHTML=r.cams.map((c)=>{
      // legacy routes saved before camId was persisted fall back to any stored snapshot, else the placeholder
      const src = c.k==='nyc-cam' ? (c.camId ? `https://webcams.nyctmc.org/api/cameras/${c.camId}/image` : (c.snapshot||null)) : c.snapshot;
      return `<div class="rv-tile" title="Show on the map"><div class="rv-media${src?' has-src':''}" data-src="${src||''}">${c.video?'<span class="rv-live">● LIVE</span>':''}
        ${src?`<img loading="lazy" onload="this.parentElement.classList.remove('err');this.parentElement.classList.add('loaded')" onerror="this.parentElement.classList.add('err')">`
             :`<div class="rv-nosnap">Live video<span>tap to watch on the map</span></div>`}
        <div class="rv-off">&#9888; Offline</div></div>
        <div class="rv-cap"><span class="rv-nm">${c.name}</span><span class="rv-rm" title="Remove">&times;</span></div></div>`;
    }).join('');
    rvRenderedFor=id;
    // tiles look up their camera by DOM position at tap time, so removals cannot skew indexes
    const tileIdx=(tile)=>[...body.querySelectorAll('.rv-tile')].indexOf(tile);
    body.querySelectorAll('.rv-tile').forEach(tile=>{
      tile.addEventListener('click',(e)=>{
        if(e.target.closest('.rv-rm')) return;
        const cams=(loadRoutes().find(z=>z.id===id)||{cams:[]}).cams;
        const c=cams[tileIdx(tile)]; if(c) jumpToRouteCam(c);
      });
      tile.querySelector('.rv-rm').addEventListener('click',()=>{
        if(!tile.isConnected) return;   // a stale handler must not eat a different camera
        const i=tileIdx(tile);
        const routes=loadRoutes(); const rr=routes.find(z=>z.id===id); if(!rr) return;
        rr.cams.splice(i,1); saveRoutes(routes); renderRouteList();
        tile.remove(); renderRouteHeader(rr);            // surgical removal: the list keeps its scroll position
        if(!rr.cams.length) body.innerHTML=`<div class="rv-empty">Empty route.<br>Tap “+ Add cameras” above, then tap cameras on the map.</div>`;
      });
    });
  }
  document.getElementById('routeView').classList.add('show');   // panel must be laid out before the observer measures tiles
  installRvLoader(body);
  // the health verdicts for this route's layers may not be fetched yet; the header
  // and tile badges fill in when they land, off the critical path
  const layers=[...new Set(r.cams.map(c=>c.k))];
  Promise.allSettled(layers.map(fetchHealthRaw)).then(()=>{
    if(store.openRoute!==id) return;
    renderRouteHeader(loadRoutes().find(x=>x.id===id)||r); applyRvBadges(id);
  });
}
// only tiles actually on screen load or refresh (deferred otherwise), and never more than 6 in flight
function installRvLoader(body){
  const bust=(m)=>{ const s=m.dataset.src, img=m.querySelector('img'); if(s&&img) img.src=s+(s.includes('?')?'&':'?')+'t='+Date.now(); };
  const visible=new Set(), queue=[]; let inFlight=0;
  const pump=()=>{ while(inFlight<6 && queue.length){ const m=queue.shift(), img=m.querySelector('img'); if(!img) continue;
      inFlight++; const done=()=>{ inFlight--; img.removeEventListener('load',done); img.removeEventListener('error',done); pump(); };
      img.addEventListener('load',done); img.addEventListener('error',done); bust(m); } };
  const enqueue=(m)=>{ if(m.dataset.src && !queue.includes(m)) queue.push(m); pump(); };
  const refresh=()=>visible.forEach(enqueue);
  if(rvIO) rvIO.disconnect();
  rvIO=new IntersectionObserver((es)=>es.forEach(e=>{ if(e.isIntersecting){ visible.add(e.target); enqueue(e.target); } else visible.delete(e.target); }), {rootMargin:'150px'});
  body.querySelectorAll('.rv-media[data-src]').forEach(m=>rvIO.observe(m));
  clearInterval(rvTimer); rvTimer=setInterval(refresh,30000);
}
function teardownRouteView(){ document.getElementById('routeView').classList.remove('show'); clearInterval(rvTimer); rvTimer=null; if(rvIO){ rvIO.disconnect(); rvIO=null; } }

/* ---------- handlers ---------- */
function bindLayerHandlers(k){
  if(LAYERS[k].kind!=='enforcement') return;   // live layers share the cams handlers, bound once at boot
  if(bound.has(k)) return; bound.add(k);
  {
    map.on('click',`${k}__hit`, (e)=>selectFeature(k,e.features[0]));
    ['mousedown','touchstart'].forEach(ev=>map.on(ev,`${k}__hit`,(e)=>{ const f=e.features[0];
      if(f) pressFeedback(f.geometry.coordinates.slice(), enfRadius(f.properties.v90)+5); }));
    map.on('mousemove',`${k}__hit`, (e)=>{ const f=e.features[0]; map.getCanvas().style.cursor='pointer'; setHighlight('hover',f.geometry.coordinates.slice(),enfRadius(f.properties.v90)+3); showTip(f.geometry.coordinates.slice(),f.properties.name); });
    map.on('mouseleave',`${k}__hit`, ()=>{ map.getCanvas().style.cursor=''; clearHighlight('hover'); hideTip(); });
  }
}

/* ---------- shareable URL ---------- */
// states follow the view, so the link carries only the layers you opt into (the Chicago
// ticket map); position and zoom bring the states back on their own
function serializeState(){ const p=new URLSearchParams();
  const optIn=[...store.activeLayers].filter(k=>LAYERS[k].kind!=='live');
  if(optIn.length) p.set('l',optIn.join(',')); const c=map.getCenter();
  p.set('c',`${c.lng.toFixed(5)},${c.lat.toFixed(5)}`); p.set('z',map.getZoom().toFixed(2));
  if(store.enfColorMode!=='verdict') p.set('cm',store.enfColorMode); if(store.basemap!=='light') p.set('b',store.basemap);
  if(store.enfFilter.verdicts.size<4) p.set('fv',[...store.enfFilter.verdicts].join(',')); if(store.enfFilter.types.size<2) p.set('ft',[...store.enfFilter.types].join(','));
  return p.toString(); }
function writeUrl(){ if(restoring) return; history.replaceState(null,'','#'+serializeState());
  // the last view, so opening the bare address returns where you left off rather than the overview
  try{ const c=map.getCenter(); localStorage.setItem('ora-view', JSON.stringify({c:[c.lng,c.lat], z:map.getZoom()})); }catch(e){} }
function lastView(){ try{ const v=JSON.parse(localStorage.getItem('ora-view')||'null');
  return (v && Array.isArray(v.c) && v.c.every(Number.isFinite) && Number.isFinite(v.z)) ? v : null; }catch(e){ return null; } }
async function restoreState(){
  const p=new URLSearchParams(location.hash.slice(1));
  const layers=(p.get('l')||'').split(',').filter(k=>LAYERS[k]);
  // reconcile the opt-in layers only: a pasted link means exactly its overlays, but states
  // follow the view and a link never switches one off (no-op at boot). An older link that
  // still names states (#l=st-WA) loads them below, so it opens on the view it was copied from.
  [...store.activeLayers].filter(k=>LAYERS[k].kind!=='live' && !layers.includes(k)).forEach(disableLayer);
  if(p.get('cm')==='type') store.enfColorMode='type'; if(p.get('b')==='satellite') store.basemap='satellite';
  if(p.has('fv')) store.enfFilter.verdicts=new Set(p.get('fv').split(',').filter(Boolean));
  if(p.has('ft')) store.enfFilter.types=new Set(p.get('ft').split(',').filter(Boolean));
  document.querySelectorAll('.color-btn[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===store.enfColorMode));
  document.querySelectorAll('.color-btn[data-base]').forEach(b=>b.classList.toggle('active',b.dataset.base===store.basemap));
  document.querySelectorAll('#fltVerdict .fchip').forEach(ch=>ch.classList.toggle('on',store.enfFilter.verdicts.has(ch.dataset.v)));
  document.querySelectorAll('#fltType .fchip').forEach(ch=>ch.classList.toggle('on',store.enfFilter.types.has(ch.dataset.t)));
  if(layers.includes('chi-enf')) expandEnfGroup();
  for(const k of layers) await enableLayer(k,false);
  if(map.getLayer('chi-enf__circle')) map.setPaintProperty('chi-enf__circle','circle-color',enfColorExpr());
  syncEnfControls(); setBasemap(store.basemap);
  if(p.has('c')&&p.has('z')){ const [lng,lat]=p.get('c').split(',').map(Number); map.jumpTo({center:[lng,lat],zoom:Number(p.get('z'))}); }
  else { const v=lastView(); if(v) map.jumpTo({center:v.c, zoom:v.z}); else showOverview(); }
  syncMaster();
}

/* ---------- build the Sources list (states A-Z) ---------- */
function renderCamList(){
  // one row per sidebar state: live layers, minus any folded into another (New York City → New York)
  const keys=Object.keys(LAYERS).filter(k=>LAYERS[k].kind==='live' && !foldParent(k)).sort((a,b)=>LAYERS[a].name.localeCompare(LAYERS[b].name));
  document.getElementById('camList').innerHTML=keys.map(k=>{ const c=LAYERS[k], live=groupKeys(k).some(g=>LAYERS[g].hasVideo);
    return `<label class="lyr"><input type="checkbox" data-layer="${k}"><span class="swatch"></span><span class="nm">${c.name}</span>${live?'<span class="live-tag">LIVE</span>':''}<span class="cnt" id="cnt-${k}"></span></label>`; }).join('');
  // wire every state box and the Chicago ticket box — a row toggles its whole group (New York
  // flips both the state and the city feed together); chi-enf and unfolded states are groups of one
  document.querySelectorAll('.lyr input[data-layer]').forEach(cb=>{ if(cb._wired) return; cb._wired=true;
    cb.addEventListener('change',async ()=>{ const k=cb.dataset.layer; if(cb.checked) await enableGroup(k); else disableGroup(k); writeUrl(); }); });
  // show each state's camera total up front, so the list reads as data before you turn anything
  // on (New York shows its two feeds combined). An active layer keeps its live count untouched.
  keys.forEach(k=>{ const c=document.getElementById('cnt-'+k); if(c && !c.textContent) c.textContent=groupCountText(k); });
}

  if(nav.mode) navBack();
});
// ← / → step through cameras whenever one is open (the fast curation path; the on-screen
// pager teaches it). The fullscreen overlay owns its own arrows, and a focused field keeps them.
document.addEventListener('keydown',(e)=>{
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  if(e.target.matches && e.target.matches('input,textarea')) return;
  if(store.mode==='media-enlarged') return;             // the overlay handles arrows itself
  if(!store.selected) return;
  e.preventDefault();
  cycleCamera(e.key==='ArrowRight' ? 1 : -1);
});

/* ---------- boot ---------- */
// one fetch of the outline serves both the drawn borders and the boxes that decide what loads,
// started now so it runs alongside the basemap style
const outlineP=fetch('states-outline.json').then(r=>r.json()).catch(e=>{ console.warn('state outline failed', e); return null; });
map.on('load', async ()=>{
  map.addSource('sat',{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'});
  const firstSymbol=(map.getStyle().layers.find(l=>l.type==='symbol')||{}).id;
  map.addLayer({id:'sat-layer',type:'raster',source:'sat',layout:{visibility:'none'}}, firstSymbol);
  // crisp US state boundaries (Positron's are missing/broken at low zoom) — below labels, above land
  map.addSource('us-states',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  outlineP.then(o=>{ if(o) map.getSource('us-states').setData(o); });
  map.addLayer({id:'state-lines',type:'line',source:'us-states',
    paint:{'line-color':'#9aa1ac','line-width':['interpolate',['linear'],['zoom'],3,0.7,5,1.1,8,1.5],'line-opacity':['interpolate',['linear'],['zoom'],3,0.8,8,0.35]}}, firstSymbol);
  // the locate-me accuracy ring sits under the camera pins, the blue dot itself above everything
  map.addSource('me-accuracy',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'me-accuracy',type:'fill',source:'me-accuracy',paint:{'fill-color':'#007aff','fill-opacity':0.12}});
  map.addLayer({id:'me-accuracy-edge',type:'line',source:'me-accuracy',paint:{'line-color':'#007aff','line-opacity':0.35,'line-width':1}});
  addCamsLayers(); bindCamsHandlers();
  map.addSource('hl-hover',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'hl-hover',type:'circle',source:'hl-hover',paint:{'circle-radius':['get','r'],'circle-color':'rgba(0,0,0,0)','circle-stroke-color':'#fff','circle-stroke-width':2.5,'circle-stroke-opacity':0.9}});

  // coverage overview markers: one counted bubble per state whose cameras are not loaded.
  // Tapping one opens that state — the finger is already on it, no side-panel detour.
  map.addSource('coverage',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'coverage-dot',type:'circle',source:'coverage',paint:{'circle-radius':['interpolate',['linear'],['get','n'],50,9,500,12,1500,16,3500,21],'circle-color':'#007aff','circle-stroke-color':'#fff','circle-stroke-width':2.5}});
  // A circle layer never takes part in label placement, so one state's name could land on a
  // neighbour's bubble (on a phone, "Oklahoma" sat on Texas). An invisible icon the size of
  // each bubble claims that space first; a name avoids it, moves from below its own bubble to
  // above it if it must (never beside it: a side label gets cut off at the screen edge), and
  // the biggest states place first.
  map.addImage('coverage-block',{width:10,height:10,data:new Uint8Array(400)});
  map.addLayer({id:'coverage-label',type:'symbol',source:'coverage',layout:{'text-field':['get','label'],'text-size':11,'text-font':['Noto Sans Bold'],
    'text-variable-anchor':['top','bottom'],'text-radial-offset':['interpolate',['linear'],['get','n'],50,15/11,500,18/11,1500,22/11,3500,27/11],
    'symbol-sort-key':['-',['get','n']],'text-allow-overlap':false},paint:{'text-color':'#1c1c1e','text-halo-color':'#fff','text-halo-width':1.6}});
  map.addLayer({id:'coverage-block',type:'symbol',source:'coverage',layout:{'icon-image':'coverage-block','icon-size':['interpolate',['linear'],['get','n'],50,2.3,500,2.9,1500,3.7,3500,4.7],
    'icon-padding':0,'icon-allow-overlap':true}});
  map.addLayer({id:'coverage-count',type:'symbol',source:'coverage',layout:{'text-field':['get','nLabel'],'text-size':10,'text-font':['Noto Sans Bold'],'text-allow-overlap':true},paint:{'text-color':'#fff'}});
  // 44px+ finger target over each state bubble; tapping is the same request as its checkbox
  map.addLayer({id:'coverage-hit',type:'circle',source:'coverage',paint:{'circle-color':'rgba(0,0,0,0)','circle-radius':26}});
  const coverTap=async (e)=>{ const f=e.features[0]; if(!f) return; await enableGroup(f.properties.k); writeUrl(); };
  ['coverage-hit','coverage-label'].forEach(id=>{
    map.on('click',id,coverTap);
    map.on('mouseenter',id,()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave',id,()=>map.getCanvas().style.cursor='');
    ['mousedown','touchstart'].forEach(ev=>map.on(ev,id,(e)=>{ const f=e.features[0]; if(f) pressFeedback(f.geometry.coordinates.slice(),26); }));
  });

  // inject states from index
  try{
    const idx=await (await fetch('states/index.json')).json();
    Object.entries(idx).forEach(([code,s])=>{ LAYERS['st-'+code]={ kind:'live', name:s.name, file:s.file, center:s.center, zoom:s.zoom, refreshMs:30000, hasVideo:!!s.video, count:s.count, snap:snapFor(s), relay:s.relay||null, sign:s.sign||null, age: s.video?'live video where available':'snapshot, updates every few min' }; });
  }catch(e){ console.warn('states index failed', e); }
  renderCamList(); renderRouteList(); buildCoverage(); updateCoverage();
  buildStateBoxes(await outlineP);

  restoring=true; await restoreState(); restoring=false; writeUrl();
  map.on('moveend', writeUrl);
  map.on('moveend', scheduleAutoLoad);
  autoLoadView();                                      // a link or reload that opens at city zoom shows pins with no clicks
  navInit(); bindMapTaps();
  // a pasted deep link in the same tab (hashchange) restores like a fresh load; our own
  // writes use replaceState, which never fires this
  window.addEventListener('hashchange', async ()=>{
    restoring=true; await restoreState(); restoring=false; writeUrl();
  });
});
</script>
</body>
</html>
