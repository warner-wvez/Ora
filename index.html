  idle.setAttribute('aria-hidden','true'); done.removeAttribute('aria-hidden'); done.textContent='';
  requestAnimationFrame(()=>{ done.textContent=ok?'Copied':'Copy failed'; });
  b.classList.toggle('copied',ok); b.classList.toggle('failed',!ok);
  clearTimeout(shareT); shareT=setTimeout(()=>{ b.classList.remove('copied','failed'); idle.removeAttribute('aria-hidden'); done.setAttribute('aria-hidden','true'); },1600);
});
document.getElementById('masterAll').addEventListener('change',e=>setAllStates(e.target.checked));
// clearing layers moves nothing: the coverage markers reappear wherever you are, and the view
// leaves every state off until one is asked for again
document.getElementById('clearAll').addEventListener('click',()=>{
  liveKeys().forEach(k=>{ if(!foldParent(k)) userOff.add(k); if(store.activeLayers.has(k)) disableLayer(k); });
  writeUrl(); });
// naming happens inline in the panel, not in a blocking browser dialog; creating a
// route drops you straight into add-mode and Done lands on the finished route view
document.getElementById('newRoute').addEventListener('click',()=>{
  const nrBtn=document.getElementById('newRoute');
  if(document.getElementById('nrRow')) return;
  nrBtn.style.display='none';
  const row=document.createElement('div'); row.className='btn-row'; row.id='nrRow';
  row.innerHTML=`<input id="nrName" type="text" placeholder="e.g. Work commute" maxlength="40" autocomplete="off">
    <button class="mini-btn" id="nrGo">Create</button><button class="mini-btn grey" id="nrCancel">&#10005;</button>`;
  nrBtn.parentElement.insertBefore(row, nrBtn);
  const inp=row.querySelector('#nrName');
  const cancel=()=>{ row.remove(); nrBtn.style.display=''; };
  const go=()=>{ const name=inp.value.trim();
    // an empty name shakes once (4px, 240ms) and says what it needs, instead of silently refusing
    if(!name){ inp.focus(); inp.placeholder='Name the route first';
      if(!reducedMotion()){ inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); } return; }
    const routes=loadRoutes(), id=uid(); routes.push({id, name, cams:[]}); saveRoutes(routes); renderRouteList(id);
    cancel(); startAddMode(id,'route-view'); };
  row.querySelector('#nrGo').addEventListener('click',go);
  row.querySelector('#nrCancel').addEventListener('click',cancel);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } if(e.key==='Escape') cancel(); });
  inp.focus();
});
document.getElementById('addDone').addEventListener('click',stopAddMode);
document.getElementById('rvClose').addEventListener('click',closeRouteView);
document.getElementById('rvAdd').addEventListener('click',()=>{ if(store.openRoute) startAddMode(store.openRoute,'route-view'); });   // Done returns here
document.getElementById('rvCopy').addEventListener('click',async ()=>{
  const r=loadRoutes().find(x=>x.id===store.openRoute); if(!r) return;
  const b=document.getElementById('rvCopy');
  if(!r.cams.length){ b.textContent='Nothing yet'; setTimeout(()=>{ b.textContent='Copy list'; },1400); return; }
  const ok=await copyText(JSON.stringify(routeExport(r), null, 2));
  b.textContent = ok ? `Copied ${r.cams.length} ✓` : 'Copy failed';
  setTimeout(()=>{ b.textContent='Copy list'; },1700);
});
wireSheet(); wireDirSheet();
document.getElementById('rvPause').addEventListener('click',()=>setRvPaused(!rvPaused));
// mobile expands the collapsed-by-default panel; desktop collapses the always-open one — one
// button, the gesture that makes sense for the viewport
const layersBtn=document.getElementById('panelToggle');
function syncLayersBtn(){ const p=document.getElementById('panel'), open=isMobile() ? p.classList.contains('expanded') : !p.classList.contains('collapsed');
  layersBtn.setAttribute('aria-expanded', String(open)); layersBtn.innerHTML='Layers '+(open?'&#9652;':'&#9662;'); }
layersBtn.addEventListener('click',()=>{
  const p=document.getElementById('panel');
  p.classList.toggle(isMobile()?'expanded':'collapsed'); syncLayersBtn();
});
new MutationObserver(syncLayersBtn).observe(document.getElementById('panel'),{attributes:true, attributeFilter:['class']});
syncLayersBtn();
// touching the map puts the drawer away, the way every phone map app does
map.getCanvas().addEventListener('pointerdown',()=>{ if(isMobile()) document.getElementById('panel').classList.remove('expanded'); });
// search + keyboard nav
const sEl=document.getElementById('search');
sEl.addEventListener('input',e=>runSearch(e.target.value));
document.getElementById('previewStop').addEventListener('click',()=>stopPreview(true));
document.getElementById('searchClear').addEventListener('click',()=>{
  sEl.value=''; runSearch(''); if(nav.mode==='place') closeNav(); sEl.focus(); });
sEl.addEventListener('focus',e=>{ if(isMobile()) document.getElementById('panel').classList.add('expanded');   // results need room below the collapsed fold
  runSearch(e.target.value); });
sEl.addEventListener('keydown',e=>{ const items=[...document.querySelectorAll('.sr-item')]; if(!items.length) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); kbdIdx=Math.min(kbdIdx+1,items.length-1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); kbdIdx=Math.max(kbdIdx-1,0); }
  else if(e.key==='Enter'){ e.preventDefault(); const h=searchHits||[]; if(h[kbdIdx<0?0:kbdIdx]) pickSearch(h[kbdIdx<0?0:kbdIdx]); return; }
  else if(e.key==='Escape'){ hideResults(); return; }
  items.forEach((it,i)=>it.classList.toggle('kbd',i===kbdIdx)); if(items[kbdIdx]) items[kbdIdx].scrollIntoView({block:'nearest'}); });
function hideResults(){ document.getElementById('search-results').classList.remove('show'); document.getElementById('panel').classList.remove('searching'); }
document.addEventListener('click',e=>{ if(!e.target.closest('.search-wrap')) hideResults(); });
// Escape and the phone's Back gesture peel the UI back one layer at a time: a menu, the
// results, the open camera, the route view, add-mode, the preview, then directions and the
// place card. The enlarge overlay and text inputs own their own Esc.
function layerOpen(){
  const am=document.querySelector('.avoid-menu');
  return !!((am && !am.hidden) || document.getElementById('search-results').classList.contains('show') || store.selected
    || store.mode==='route-view' || store.mode==='add-to-route' || store.mode==='media-enlarged' || preview || nav.mode
    || (isMobile() && document.getElementById('panel').classList.contains('expanded')));
}
function escPeel(fromBack){
  if(store.mode==='media-enlarged'){ if(fromBack) closeEnlarge(); return; }
  if(isMobile() && fromBack && document.getElementById('panel').classList.contains('expanded') && !nav.mode
     && !document.getElementById('search-results').classList.contains('show')){ document.getElementById('panel').classList.remove('expanded'); return; }
  escStep();
}
// One extra history entry stands in for "something is open", so Back closes it instead of
// leaving the site. Closing everything by hand takes that entry back off.
let backArmed=false, backSkip=0, backNav=false;
function syncBack(){
  const open=layerOpen();
  if(open && !backArmed){ history.pushState({oraLayer:1}, '', location.href); backArmed=true; }
  else if(!open && backArmed){ backArmed=false; backSkip++; backNav=true; history.back(); }
}
window.addEventListener('popstate',()=>{
  backNav=true; setTimeout(()=>{ backNav=false; }, 100);   // hashchange, if any, fires right after popstate
  if(backSkip){ backSkip--; return; }
  backArmed=false;
  if(layerOpen()) escPeel(true);
  setTimeout(syncBack, 0);
});
['click','keyup','input','touchend'].forEach(ev=>document.addEventListener(ev,()=>setTimeout(syncBack,80),true));
document.addEventListener('keydown',(e)=>{
  if(e.key!=='Escape' || (e.target.matches && e.target.matches('input'))) return;
  if(store.mode==='media-enlarged') return;
  escStep();
});
function escStep(){
  if(hideQr()){ document.getElementById('share').focus(); return; }
  const am=document.querySelector('.avoid-menu');
  if(am && !am.hidden){ am.hidden=true; const c=document.querySelector('[data-avoid]'); if(c){ c.setAttribute('aria-expanded','false'); c.focus(); } return; }
  const sr=document.getElementById('search-results');
  if(sr.classList.contains('show')){ hideResults(); return; }
  if(store.selected){ clearSelection(); return; }
  if(store.mode==='route-view'){ closeRouteView(); return; }
  if(store.mode==='add-to-route'){ stopAddMode(); return; }
  if(preview){ stopPreview(true); return; }
  if(nav.mode) navBack();
}
// ← / → step through cameras whenever one is open (the fast curation path; the on-screen
// pager teaches it). The fullscreen overlay owns its own arrows, and a focused field keeps them.
document.addEventListener('keydown',(e)=>{
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  if(e.target.matches && e.target.matches('input,textarea')) return;
  if(store.mode==='media-enlarged') return;             // the overlay handles arrows itself
  if(!store.selected) return;
  e.preventDefault();
  cycleCamera(e.key==='ArrowRight' ? 1 : -1);
});

/* ---------- boot ---------- */
// one fetch of the outline serves both the drawn borders and the boxes that decide what loads,
// started now so it runs alongside the basemap style
const outlineP=fetch('states-outline.json').then(r=>r.json()).catch(e=>{ console.warn('state outline failed', e); return null; });
map.on('load', async ()=>{
  map.addSource('sat',{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'});
  const firstSymbol=(map.getStyle().layers.find(l=>l.type==='symbol')||{}).id;
  map.addLayer({id:'sat-layer',type:'raster',source:'sat',layout:{visibility:'none'}}, firstSymbol);
  // crisp US state boundaries (Positron's are missing/broken at low zoom) — below labels, above land
  map.addSource('us-states',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  outlineP.then(o=>{ if(o) map.getSource('us-states').setData(o); });
  map.addLayer({id:'state-lines',type:'line',source:'us-states',
    paint:{'line-color':'#9aa1ac','line-width':['interpolate',['linear'],['zoom'],3,0.7,5,1.1,8,1.5],'line-opacity':['interpolate',['linear'],['zoom'],3,0.8,8,0.35]}}, firstSymbol);
  // the locate-me accuracy ring sits under the camera pins, the blue dot itself above everything
  map.addSource('me-accuracy',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'me-accuracy',type:'fill',source:'me-accuracy',paint:{'fill-color':'#007aff','fill-opacity':0.12}});
  map.addLayer({id:'me-accuracy-edge',type:'line',source:'me-accuracy',paint:{'line-color':'#007aff','line-opacity':0.35,'line-width':1}});
  addCamsLayers(); bindCamsHandlers();
  map.addSource('hl-hover',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'hl-hover',type:'circle',source:'hl-hover',paint:{'circle-radius':['get','r'],'circle-color':'rgba(0,0,0,0)','circle-stroke-color':'#fff','circle-stroke-width':2.5,'circle-stroke-opacity':0.9}});

  // coverage overview markers: one counted bubble per state whose cameras are not loaded.
  // Tapping one opens that state — the finger is already on it, no side-panel detour.
  map.addSource('coverage',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'coverage-dot',type:'circle',source:'coverage',paint:{'circle-radius':['interpolate',['linear'],['get','n'],50,9,500,12,1500,16,3500,21],'circle-color':'#007aff','circle-stroke-color':'#fff','circle-stroke-width':2.5}});
  // A circle layer never takes part in label placement, so one state's name could land on a
  // neighbour's bubble (on a phone, "Oklahoma" sat on Texas). An invisible icon the size of
  // each bubble claims that space first; a name avoids it, moves from below its own bubble to
  // above it if it must (never beside it: a side label gets cut off at the screen edge), and
  // the biggest states place first.
  map.addImage('coverage-block',{width:10,height:10,data:new Uint8Array(400)});
  map.addLayer({id:'coverage-label',type:'symbol',source:'coverage',layout:{'text-field':['get','label'],'text-size':11,'text-font':['Noto Sans Bold'],
    'text-variable-anchor':['top','bottom'],'text-radial-offset':['interpolate',['linear'],['get','n'],50,15/11,500,18/11,1500,22/11,3500,27/11],
    'symbol-sort-key':['-',['get','n']],'text-allow-overlap':false},paint:{'text-color':'#1c1c1e','text-halo-color':'#fff','text-halo-width':1.6}});
  map.addLayer({id:'coverage-block',type:'symbol',source:'coverage',layout:{'icon-image':'coverage-block','icon-size':['interpolate',['linear'],['get','n'],50,2.3,500,2.9,1500,3.7,3500,4.7],
    'icon-padding':0,'icon-allow-overlap':true}});
  map.addLayer({id:'coverage-count',type:'symbol',source:'coverage',layout:{'text-field':['get','nLabel'],'text-size':10,'text-font':['Noto Sans Bold'],'text-allow-overlap':true},paint:{'text-color':'#fff'}});
  // 44px+ finger target over each state bubble; tapping is the same request as its checkbox
  map.addLayer({id:'coverage-hit',type:'circle',source:'coverage',paint:{'circle-color':'rgba(0,0,0,0)','circle-radius':26}});
  const coverTap=async (e)=>{ const f=e.features[0]; if(!f) return; await enableGroup(f.properties.k); writeUrl(); };
  ['coverage-hit','coverage-label'].forEach(id=>{
    map.on('click',id,coverTap);
    map.on('mouseenter',id,()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave',id,()=>map.getCanvas().style.cursor='');
    ['mousedown','touchstart'].forEach(ev=>map.on(ev,id,(e)=>{ const f=e.features[0]; if(f) pressFeedback(f.geometry.coordinates.slice(),26); }));
  });

  // inject states from index
  try{
    const idx=await (await fetch('states/index.json')).json();
    Object.entries(idx).forEach(([code,s])=>{ LAYERS['st-'+code]={ kind:'live', name:s.name, file:s.file, center:s.center, zoom:s.zoom, refreshMs:30000, hasVideo:!!s.video, count:s.count, snap:snapFor(s), relay:s.relay||null, sign:s.sign||null, age: s.video?'live video where available':'snapshot, updates every few min' }; });
  }catch(e){ console.warn('states index failed', e); }
  renderCamList(); renderRouteList(); buildCoverage(); updateCoverage();
  buildStateBoxes(await outlineP);

  restoring=true; await restoreState(); restoring=false; writeUrl();
  map.on('moveend', writeUrl);
  map.on('moveend', scheduleAutoLoad);
  autoLoadView();                                      // a link or reload that opens at city zoom shows pins with no clicks
  navInit(); bindMapTaps();
  // a pasted deep link in the same tab (hashchange) restores like a fresh load; our own
  // writes use replaceState, which never fires this
  window.addEventListener('hashchange', async ()=>{
    if(backNav){ backNav=false; writeUrl(); return; }      // our own Back step, not a pasted link
    restoring=true; await restoreState(); restoring=false; writeUrl();
  });
});
</script>
