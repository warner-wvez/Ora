name: docs
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install markdown==3.7 pytest==8.3.3
      - run: pytest scripts/test_build_docs.py -q
      - run: python scripts/build_docs.py --check
